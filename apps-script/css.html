<style>
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --line: #dfe3e8;
  --text: #1f2933;
  --muted: #6b7885;
  --brand: #0b6b5e;
  --brand-soft: #e6f2f0;
  --warn: #b45309;
  --warn-soft: #fef3c7;
  --danger: #b42318;
  --ok: #067647;
  --radius: 10px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Sarabun", "Noto Sans Thai", "Segoe UI", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.55;
}

/* ---------------------------------------------------------------- topbar */

.topbar {
  position: sticky; top: 0; z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.topbar-inner {
  display: flex; align-items: center; gap: 16px;
  max-width: 1100px; margin: 0 auto; padding: 10px 16px;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  background: none; border: 0; padding: 0; cursor: pointer; text-align: left;
  font-family: inherit; color: inherit;
}
.brand-mark {
  background: var(--brand); color: #fff; font-weight: 700; font-size: 13px;
  padding: 6px 9px; border-radius: 8px; letter-spacing: .5px;
}
.brand-text { display: flex; flex-direction: column; line-height: 1.2; }
.brand-text small { color: var(--muted); font-size: 12px; }
.topnav { display: flex; gap: 4px; margin-left: auto; }
.topnav button {
  background: none; border: 0; padding: 8px 14px; border-radius: 8px;
  font-family: inherit; font-size: 15px; color: var(--muted); cursor: pointer;
}
.topnav button:hover { background: var(--bg); }
.topnav button.active { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
.who { font-size: 12px; color: var(--muted); max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.mask-banner {
  background: var(--warn-soft); color: var(--warn);
  font-size: 13px; text-align: center; padding: 6px 16px;
  border-top: 1px solid #fde68a;
}

/* ----------------------------------------------------------------- layout */

main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 64px; }
.loading { color: var(--muted); padding: 40px 0; text-align: center; }

.page-head {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px;
}
.page-head h1 { font-size: 21px; margin: 0; }
.page-head .spacer { margin-left: auto; }

.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 18px; margin-bottom: 16px;
}
.card > h2 {
  font-size: 15px; margin: 0 0 14px; color: var(--brand);
  text-transform: none; letter-spacing: 0;
}

/* ------------------------------------------------------------------ forms */

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.grid .full { grid-column: 1 / -1; }
@media (max-width: 680px) { .grid { grid-template-columns: 1fr; } }

label.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
label.field > span .req { color: var(--danger); }
input, select, textarea {
  font-family: inherit; font-size: 15px; color: var(--text);
  padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: #fff; width: 100%;
}
input:focus, select:focus, textarea:focus {
  outline: 2px solid var(--brand-soft); border-color: var(--brand);
}
textarea { min-height: 68px; resize: vertical; }

.btn {
  font-family: inherit; font-size: 15px; padding: 9px 18px;
  border-radius: 8px; border: 1px solid var(--line); background: #fff;
  color: var(--text); cursor: pointer;
}
.btn:hover { background: var(--bg); }
.btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
.btn-primary:hover { background: #095a4f; }
.btn-danger { color: var(--danger); border-color: #f2c7c3; }
.btn-sm { padding: 5px 11px; font-size: 13px; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

/* ------------------------------------------------------------------ table */

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; font-size: 12px; white-space: nowrap; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--brand-soft); }
.table-wrap { overflow-x: auto; }

.chip {
  display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px;
  background: var(--bg); color: var(--muted); border: 1px solid var(--line);
}
.chip-imc { background: var(--brand-soft); color: var(--brand); border-color: #bfded8; }
.chip-no { background: #f1f3f5; }
.chip-closed { background: #f1f3f5; color: var(--muted); }
.chip-warn { background: var(--warn-soft); color: var(--warn); border-color: #fde68a; }

.filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.filters input { min-width: 240px; flex: 1; }
.filters select { width: auto; }

.empty { text-align: center; color: var(--muted); padding: 36px 0; }

/* บรรทัดหัวการ์ด ใช้เฉพาะบนมือถือ บนจอใหญ่ซ่อนไว้เพราะมีคอลัมน์อยู่แล้ว */
table.cards td.head { display: none; }

/* --------------------------------------------------------------- BI form */

.bi-item { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
.bi-item.done { border-color: #bfded8; background: #fbfdfd; }
.bi-head { display: flex; gap: 8px; align-items: baseline; margin-bottom: 8px; }
.bi-no {
  background: var(--brand); color: #fff; border-radius: 6px;
  width: 24px; height: 24px; display: inline-flex; align-items: center;
  justify-content: center; font-size: 13px; flex: none;
}
.bi-title { font-weight: 600; }
.bi-title small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
.bi-options { display: flex; flex-direction: column; gap: 4px; }
.bi-opt {
  display: flex; gap: 9px; align-items: flex-start; padding: 7px 9px;
  border-radius: 8px; cursor: pointer; font-size: 14px;
}
.bi-opt:hover { background: var(--bg); }
.bi-opt input { width: auto; margin-top: 3px; flex: none; }
.bi-opt .score {
  font-variant-numeric: tabular-nums; font-weight: 600; color: var(--brand);
  min-width: 16px;
}

.bi-summary {
  position: sticky; bottom: 0; z-index: 10;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 18px; margin-top: 16px;
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  box-shadow: 0 -2px 12px rgba(0,0,0,.06);
}
.bi-total { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.bi-total small { font-size: 14px; font-weight: 400; color: var(--muted); }

/* -------------------------------------------------------------- dashboard */

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.stat .v { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .k { font-size: 13px; color: var(--muted); }

.bars { display: flex; align-items: flex-end; gap: 8px; height: 140px; margin-top: 12px; }
.bar { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; }
.bar .fill { width: 100%; background: var(--brand); border-radius: 4px 4px 0 0; min-height: 3px; }
.bar .lbl { font-size: 11px; color: var(--muted); white-space: nowrap; }

/* ----------------------------------------------------------------- misc */

.timeline { border-left: 2px solid var(--line); margin-left: 8px; padding-left: 16px; }
.tl-item { position: relative; padding-bottom: 16px; }
.tl-item::before {
  content: ''; position: absolute; left: -23px; top: 6px;
  width: 10px; height: 10px; border-radius: 50%; background: var(--brand);
}
.tl-date { font-size: 12px; color: var(--muted); }

.kv { display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
@media (max-width: 520px) { .kv { grid-template-columns: 110px 1fr; } }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: #1f2933; color: #fff; padding: 11px 20px; border-radius: 8px;
  font-size: 14px; z-index: 100; max-width: 90vw;
}
.toast.err { background: var(--danger); }

/* ------------------------------------------------------------- โทรศัพท์ */

@media (max-width: 680px) {
  main { padding: 14px 12px 80px; }

  .topbar-inner { flex-wrap: wrap; gap: 6px 12px; padding: 8px 12px; }
  .brand-text small { display: none; }
  .who { display: none; }
  .topnav { margin-left: auto; }
  .topnav button { padding: 8px 12px; }

  .page-head h1 { font-size: 19px; }
  .card { padding: 14px; }

  /* iOS ซูมหน้าจอเองเมื่อโฟกัสช่องที่ตัวอักษรเล็กกว่า 16px */
  input, select, textarea { font-size: 16px; }
  .filters { flex-direction: column; }
  .filters input, .filters select { width: 100%; min-width: 0; }

  /* นิ้วมือกดง่ายกว่าเมาส์ ต้องการพื้นที่กดใหญ่ขึ้น */
  .btn { padding: 12px 18px; }
  .bi-opt { padding: 11px 9px; }
  .bi-item { padding: 12px; }

  /* ตารางรายชื่อ 9 คอลัมน์เลื่อนซ้ายขวาบนมือถือไม่ไหว เปลี่ยนเป็นการ์ดแทน */
  table.cards thead { display: none; }
  table.cards, table.cards tbody, table.cards tr, table.cards td { display: block; width: 100%; }
  table.cards tr {
    border: 1px solid var(--line); border-radius: var(--radius);
    margin-bottom: 10px; padding: 10px 14px; background: var(--surface);
  }
  table.cards td { border: 0; padding: 3px 0; display: flex; gap: 10px; align-items: baseline; }
  table.cards td::before {
    content: attr(data-l); color: var(--muted); font-size: 12px;
    min-width: 88px; flex: none;
  }
  table.cards td.head { display: block; font-size: 17px; padding-bottom: 6px; }
  table.cards td.head::before { display: none; }
  table.cards td.hn-cell, table.cards td.name-cell { display: none; }
  .table-wrap { overflow-x: visible; }
  .card.list-card { padding: 0; background: none; border: 0; }
}
</style>
