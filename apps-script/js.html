<script>
/* ------------------------------------------------------------ พื้นฐาน */

var BOOT = null;
var VIEW = { name: 'list', param: null };

/**
 * เรียกฟังก์ชันฝั่งเซิร์ฟเวอร์แบบ Promise
 * ถ้าได้ null กลับมาแปลว่าแปลงข้อมูลข้ามฝั่งไม่สำเร็จ ให้บอกสาเหตุตรง ๆ
 * ดีกว่าปล่อยให้ไปพังเป็น TypeError ที่อ่านไม่รู้เรื่องทีหลัง
 */
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(function (result) {
        if (result === null || result === undefined) {
          reject(new Error('เซิร์ฟเวอร์ส่งข้อมูลกลับมาไม่ได้ (' + fn + ') ' +
            'อาจมีค่าผิดปกติในชีต กรุณาแจ้งผู้ดูแลระบบ'));
          return;
        }
        resolve(result);
      })
      .withFailureHandler(function (e) { reject(e); })
      [fn].apply(null, args);
  });
}

function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function $(sel) { return document.querySelector(sel); }
function main() { return document.getElementById('main'); }

var toastTimer = null;
function toast(msg, isError) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (isError ? ' err' : '');
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.hidden = true; }, isError ? 7000 : 3000);
}

function fail(e) { toast((e && e.message) ? e.message : String(e), true); }

function busy(msg) {
  main().innerHTML = '<div class="loading">' + esc(msg || 'กำลังโหลด…') + '</div>';
}

/* --------------------------------------------------------------- ไอคอน */

var ICONS = {
  dashboard: '<rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect>',
  patients: '<path d="M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 18.5V20"></path><circle cx="10" cy="8" r="3.2"></circle><path d="M19 20v-1.4a3.2 3.2 0 0 0-2.4-3.1"></path><path d="M15.2 5.2a3.2 3.2 0 0 1 0 5.6"></path>',
  followups: '<rect x="4" y="5.5" width="16" height="14.5" rx="2"></rect><path d="M4 10h16M9 3.5v4M15 3.5v4"></path>',
  settings: '<path d="M4 7h16M4 12h16M4 17h16"></path><circle cx="9" cy="7" r="2.2" fill="currentColor" stroke="none"></circle><circle cx="15" cy="12" r="2.2" fill="currentColor" stroke="none"></circle><circle cx="8" cy="17" r="2.2" fill="currentColor" stroke="none"></circle>',
  back: '<path d="M19 12H5M11 6l-6 6 6 6"></path>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"></path>'
};

function icon(name, size, stroke) {
  return '<svg width="' + (size || 18) + '" height="' + (size || 18) + '" viewBox="0 0 24 24" ' +
    'fill="none" stroke="currentColor" stroke-width="' + (stroke || 1.6) + '" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[name] + '</svg>';
}

/* --------------------------------------------------------------- วันที่ */

var TH_MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.',
  'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

/** yyyy-MM-dd เป็นวันที่แบบไทย พ.ศ. */
function thDate(iso) {
  if (!iso) return '—';
  var p = String(iso).split('-');
  if (p.length !== 3) return String(iso);
  return parseInt(p[2], 10) + ' ' + TH_MONTHS[parseInt(p[1], 10) - 1] + ' ' + (parseInt(p[0], 10) + 543);
}

/* ----------------------------------------------------------- ตัวสร้างฟอร์ม */

function field(f, value) {
  var v = (value === undefined || value === null) ? '' : value;
  var label = '<span>' + esc(f.l) + (f.req ? ' <em class="req">*</em>' : '') + '</span>';
  var cls = 'field' + (f.full ? ' full' : '');
  var input;

  if (f.t === 'select') {
    var opts = ['<option value="">— เลือก —</option>'].concat((f.o || []).map(function (o) {
      var val = (typeof o === 'object') ? o.value : o;
      return '<option value="' + esc(val) + '"' + (String(val) === String(v) ? ' selected' : '') + '>' +
        esc(val) + '</option>';
    }));
    input = '<select name="' + f.k + '" autocomplete="off"' + (f.req ? ' required' : '') + '>' + opts.join('') + '</select>';
  } else if (f.t === 'textarea') {
    input = '<textarea name="' + f.k + '">' + esc(v) + '</textarea>';
  } else if (f.t === 'checkbox') {
    return '<label class="check' + (f.full ? ' full' : '') + '">' +
      '<input type="checkbox" name="' + f.k + '"' +
      (String(v) === 'TRUE' || v === true ? ' checked' : '') + '>' +
      '<span>' + esc(f.l) + '</span></label>';
  } else {
    input = '<input type="' + (f.t || 'text') + '" name="' + f.k + '" value="' + esc(v) + '"' +
      ' autocomplete="off"' + (f.ph ? ' placeholder="' + esc(f.ph) + '"' : '') +
      (f.req ? ' required' : '') + '>';
  }
  return '<label class="' + cls + '">' + label + input + '</label>';
}

function readForm(formEl) {
  var out = {};
  Array.prototype.forEach.call(formEl.elements, function (el) {
    if (!el.name) return;
    if (el.type === 'checkbox') out[el.name] = el.checked ? 'TRUE' : 'FALSE';
    else if (el.type === 'radio') { if (el.checked) out[el.name] = el.value; }
    else out[el.name] = el.value.trim();
  });
  return out;
}

/* ----------------------------------------------------------- โครงหน้าจอ */

var NAV = [
  { key: 'dashboard', icon: 'dashboard', label: 'ภาพรวม', short: 'ภาพรวม' },
  { key: 'list', icon: 'patients', label: 'รายชื่อผู้ป่วย', short: 'ผู้ป่วย' },
  { key: 'followups', icon: 'followups', label: 'การติดตาม', short: 'ติดตาม' },
  { key: 'settings', icon: 'settings', label: 'ตั้งค่า', short: 'ตั้งค่า', adminOnly: true }
];

/** หน้าย่อยที่ควรทำให้เมนูหลักตัวไหนสว่างค้างไว้ */
var NAV_OF_VIEW = {
  list: 'list', patient: 'list', detail: 'list', bi: 'list', fu: 'list', close: 'list',
  dashboard: 'dashboard', followups: 'followups', settings: 'settings'
};

var TITLE_OF_VIEW = {
  list: 'รายชื่อผู้ป่วย', patient: 'ข้อมูลผู้ป่วย', detail: 'เวชระเบียน',
  bi: 'ประเมิน BI', fu: 'บันทึกการติดตาม', close: 'จบโปรแกรม',
  dashboard: 'ภาพรวมงาน', followups: 'การติดตาม', settings: 'ตั้งค่า'
};

function visibleNav() {
  return NAV.filter(function (n) { return !n.adminOnly || (BOOT && BOOT.user && BOOT.user.isAdmin); });
}

function renderNav() {
  var items = visibleNav();

  document.getElementById('sidenav').innerHTML = items.map(function (n) {
    return '<button class="navitem" data-nav="' + n.key + '" onclick="go(\'' + n.key + '\')">' +
      icon(n.icon) + '<span>' + esc(n.label) + '</span></button>';
  }).join('');

  document.getElementById('bottomnav').innerHTML = items.map(function (n) {
    return '<button class="tab" data-nav="' + n.key + '" onclick="go(\'' + n.key + '\')">' +
      icon(n.icon, 22) + '<span>' + esc(n.short) + '</span></button>';
  }).join('');
}

function go(name, param) {
  VIEW = { name: name, param: param };

  var active = NAV_OF_VIEW[name] || '';
  Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'), function (b) {
    b.classList.toggle('active', b.getAttribute('data-nav') === active);
  });
  document.getElementById('mobile-title').textContent = TITLE_OF_VIEW[name] || '';
  document.body.classList.toggle('hide-tabs', name === 'bi');

  window.scrollTo(0, 0);
  ({
    list: renderList,
    dashboard: renderDashboard,
    followups: renderFollowups,
    settings: renderSettings,
    patient: renderPatientForm,
    detail: renderDetail,
    bi: renderBiForm,
    fu: renderFuForm,
    close: renderCloseForm
  })[name](param);
}

function initials(name) {
  var s = String(name || '').trim();
  return s ? s.charAt(0) : '?';
}

function boot() {
  call('apiBootstrap').then(function (b) {
    BOOT = b;
    document.getElementById('app-name').textContent = b.appName;
    document.getElementById('app-org-unit').textContent = b.orgUnit || b.org;
    document.getElementById('app-org-place').textContent = b.orgPlace || '';
    document.getElementById('who-email').textContent = b.user.email;
    document.getElementById('user-initial').textContent = initials(b.user.email);    document.getElementById('mask-banner').hidden = !b.maskMode;
    renderNav();
    go('list');
  }).catch(function (e) {
    main().innerHTML = '<div class="card"><h2>เข้าใช้งานไม่ได้</h2><p>' +
      esc(e && e.message ? e.message : e) + '</p></div>';
  });
}

/* ------------------------------------------------------- หน้ารายชื่อผู้ป่วย */

var listFilter = { q: '', status: '', screening: '' };

function renderList() {
  busy();
  call('apiListPatients', listFilter).then(function (rows) {
    var active = rows.filter(function (p) { return String(p.status) !== 'closed'; }).length;

    var html =
      '<div class="page-head">' +
      '  <div class="head-text">' +
      '    <h1>รายชื่อผู้ป่วย</h1>' +
      '    <span class="sub num">ทั้งหมด ' + rows.length + ' ราย · กำลังดูแล ' + active + ' ราย</span>' +
      '  </div>' +
      '  <div class="spacer"></div>' +
      '  <button class="btn btn-primary" onclick="go(\'patient\')">+ ลงทะเบียนเคสใหม่</button>' +
      '</div>' +
      '<div class="filters">' +
      '  <input id="f-q" autocomplete="off" placeholder="ค้นหา HN ชื่อ ตำบล หรือ Dx" value="' + esc(listFilter.q) + '">' +
      '  <select id="f-status" autocomplete="off">' +
      '    <option value="">ทุกสถานะ</option>' +
      '    <option value="active">กำลังดูแล</option>' +
      '    <option value="closed">จบโปรแกรมแล้ว</option>' +
      '  </select>' +
      '  <select id="f-screening" autocomplete="off">' +
      '    <option value="">ทุกผลคัดกรอง</option>' +
      '    <option value="IMC">เข้า IMC</option>' +
      '    <option value="NoIMC">ไม่เข้าเกณฑ์</option>' +
      '  </select>' +
      '</div>';

    if (!rows.length) {
      html += '<div class="card"><div class="empty">ยังไม่มีข้อมูลตามเงื่อนไขนี้</div></div>';
    } else {
      // data-l ใช้เป็นป้ายกำกับตอนตารางกลายเป็นการ์ดบนมือถือ (ดู css.html)
      // จำนวนช่องที่มองเห็นต้องเท่ากับจำนวนหัวตารางเสมอ ไม่งั้นข้อมูลจะเลื่อนคอลัมน์
      html += '<div class="card flush"><div class="table-wrap"><table class="cards"><thead><tr>' +
        '<th>ผู้ป่วย</th><th>การวินิจฉัย</th><th>Ward</th><th>วัน Start</th>' +
        '<th>Barthel Index</th><th>ผลคัดกรอง</th><th>สถานะ</th>' +
        '</tr></thead><tbody>' +
        rows.map(patientRow).join('') +
        '</tbody></table></div></div>' +
        '<p class="count-line num">แสดง ' + rows.length + ' ราย</p>';
    }

    main().innerHTML = html;
    $('#f-status').value = listFilter.status;
    $('#f-screening').value = listFilter.screening;

    var t = null;
    $('#f-q').addEventListener('input', function (e) {
      clearTimeout(t);
      var v = e.target.value;
      t = setTimeout(function () { listFilter.q = v; renderList(); }, 350);
    });
    $('#f-status').addEventListener('change', function (e) { listFilter.status = e.target.value; renderList(); });
    $('#f-screening').addEventListener('change', function (e) { listFilter.screening = e.target.value; renderList(); });
  }).catch(fail);
}

function patientRow(p) {
  var meta = [p.sex, p.age ? p.age + ' ปี' : ''].filter(String).join(' · ');
  return '<tr onclick="go(\'detail\',\'' + esc(p.hn) + '\')">' +
    '<td class="head"><strong>' + esc(p.hn) + '</strong> ' + esc(p.full_name || '') + '</td>' +
    '<td data-l="ผู้ป่วย" class="name-cell"><div class="cell-person">' +
      '<span class="avatar row">' + esc(initials(p.first_name)) + '</span>' +
      '<span class="who"><b>' + esc(p.full_name || '—') + '</b>' +
      '<small class="num">' + esc(p.hn) + (meta ? ' · ' + esc(meta) : '') + '</small></span>' +
    '</div></td>' +
    '<td data-l="Dx">' + esc(p.dx || '—') + '</td>' +
    '<td data-l="Ward">' + esc(p.ward || '—') + '</td>' +
    '<td data-l="วัน Start" class="num">' + esc(thDate(p.start_date)) + '</td>' +
    '<td data-l="BI">' + biCell(p.first_bi, p.latest_bi) + '</td>' +
    '<td data-l="ผลคัดกรอง">' + screeningChip(p.screening_result) + '</td>' +
    '<td data-l="สถานะ">' + statusChip(p.status) + '</td>' +
    '</tr>';
}

/** แสดงพัฒนาการเป็น "แรกรับ → ล่าสุด" พร้อมส่วนต่าง อ่านทีเดียวจบ */
function biCell(first, latest) {
  if (first === '' || first === undefined || first === null) {
    return '<span style="color:var(--faint)">ยังไม่ประเมิน</span>';
  }
  var a = Number(first), b = Number(latest);
  var diff = b - a;
  var badge = isNaN(diff) ? '' :
    (diff > 0
      ? '<span class="chip chip-ok chip-sq num">+' + diff + '</span>'
      : (diff === 0
        ? '<span class="chip chip-flat chip-sq num">0</span>'
        : '<span class="chip chip-warn chip-sq num">' + diff + '</span>'));

  return '<span class="bi-cell num"><span class="from">' + esc(a) + '</span>' +
    '<span style="color:#b6bec6">' + icon('arrow', 14, 2) + '</span>' +
    '<span class="to">' + esc(isNaN(b) ? '—' : b) + '</span>' + badge + '</span>';
}

function screeningChip(v) {
  if (v === 'IMC') return '<span class="chip chip-brand">เข้า IMC</span>';
  if (v === 'NoIMC') return '<span class="chip">ไม่เข้าเกณฑ์</span>';
  return '<span class="chip">ยังไม่ประเมิน</span>';
}

function statusChip(v) {
  return v === 'closed'
    ? '<span class="chip chip-flat">จบโปรแกรม</span>'
    : '<span class="chip chip-brand">กำลังดูแล</span>';
}

function backBtn(view, param) {
  return '<button class="back" onclick="go(\'' + view + '\'' +
    (param ? ',\'' + esc(param) + '\'' : '') + ')">' + icon('back', 15, 2) +
    '<span>ย้อนกลับ</span></button>';
}

/* ------------------------------------------------------ ฟอร์มข้อมูลผู้ป่วย */

  return [
    ['ข้อมูลผู้ป่วย', [
      { k: 'hn', l: 'HN', t: 'text', req: true },
      { k: 'cid', l: 'เลขประจำตัวประชาชน', t: 'text', ph: '13 หลัก' },
      { k: 'prefix', l: 'คำนำหน้า', t: 'select', o: V.PREFIX },
      { k: 'sex', l: 'เพศ', t: 'select', o: V.SEX },
      { k: 'first_name', l: 'ชื่อ', t: 'text', req: true },
      { k: 'last_name', l: 'นามสกุล', t: 'text' },
      { k: 'age', l: 'อายุ (ปี)', t: 'number' },
      { k: 'rights', l: 'สิทธิ์การรักษา', t: 'select', o: V.RIGHTS }
    ]],
    ['การวินิจฉัย', [
      { k: 'dx', l: 'Dx', t: 'select', o: V.DX, req: true },
      { k: 'hemiparesis_side', l: 'hemiparesis ข้าง', t: 'text', ph: 'เช่น right, left' },
      { k: 'dx_detail', l: 'Diagnosis ร่วม / รายละเอียด', t: 'text' },
      { k: 'rt_pa', l: 'ได้รับ rt-PA', t: 'checkbox' },
      { k: 'ct_mri', l: 'CT / MRI / X-ray', t: 'textarea', full: true },
      { k: 'operation', l: 'Operation', t: 'textarea', full: true },
      { k: 'underlying', l: 'U/D (โรคประจำตัว)', t: 'textarea', full: true },
      { k: 'other_problems', l: 'ปัญหาอื่น ๆ หรือภาวะแทรกซ้อนที่พบ', t: 'textarea', full: true }
    ]],
    ['การนอนโรงพยาบาล', [
      { k: 'admit_date', l: 'วันที่ admit', t: 'date' },
      { k: 'dc_date', l: 'วันที่ discharge', t: 'date' },
      { k: 'ward', l: 'Ward', t: 'select', o: V.WARD }
    ]],
    ['ที่อยู่และการติดต่อ', [
      { k: 'address', l: 'ที่อยู่', t: 'text', full: true },
      { k: 'tambon', l: 'ตำบล', t: 'text' },
      { k: 'phone1', l: 'เบอร์โทรศัพท์', t: 'text' },
      { k: 'phone2', l: 'เบอร์โทรศัพท์สำรอง', t: 'text' }
    ]],
    ['โปรแกรม IMC', [
      { k: 'imc_program', l: 'รูปแบบโปรแกรม', t: 'select', o: V.IMC_PROGRAM },
      { k: 'start_date', l: 'วัน Start โปรแกรม', t: 'date' },
      { k: 'kbh_appt_date', l: 'วันนัด OPD', t: 'date' },
      { k: 'kbh_appt_time', l: 'เวลานัด', t: 'time' },
      { k: 'kbh_hospital', l: 'โรงพยาบาลที่นัด', t: 'text' },
      { k: 'screening_result', l: 'ผลคัดกรอง', t: 'select', o: V.SCREENING },
      { k: 'note', l: 'หมายเหตุ', t: 'textarea', full: true }
    ]]
  ];
}

function renderPatientForm(hn) {
  if (!hn) return drawPatientForm({});
  busy();
  call('apiGetPatient', hn)
    .then(function (d) { drawPatientForm(d.patient); })
    .catch(fail);
}

function drawPatientForm(p) {
  var isNew = !p.patient_id;
  var html = backBtn(isNew ? 'list' : 'detail', isNew ? '' : p.hn) +
    '<div class="page-head"><div class="head-text"><h1>' +
    (isNew ? 'ลงทะเบียนเคสใหม่' : 'แก้ไขข้อมูล ' + esc(p.hn)) +
    '</h1></div></div>' +
    '<form id="patient-form">' +
    '<input type="hidden" name="patient_id" value="' + esc(p.patient_id || '') + '">';

  patientSections().forEach(function (sec) {
    html += '<div class="card"><h2>' + esc(sec[0]) + '</h2><div class="grid">' +
      sec[1].map(function (f) { return field(f, p[f.k]); }).join('') +
      '</div></div>';
  });

  html += '<div class="btn-row"><button type="submit" class="btn btn-primary">บันทึก</button></div></form>';
  main().innerHTML = html;

  $('#patient-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var data = readForm(e.target);
    var warn = validateCid(data.cid);
    if (warn && !confirm(warn + '\n\nต้องการบันทึกต่อหรือไม่')) return;

    var btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
    call('apiSavePatient', data).then(function (r) {
      toast('บันทึกเรียบร้อย');
      go('detail', r.hn);
    }).catch(function (err) {
      btn.disabled = false; btn.textContent = 'บันทึก';
      fail(err);
    });
  });
}

/** ตรวจเลขบัตรประชาชนแบบหลักตรวจสอบ คืนข้อความเตือนถ้าผิด */
function validateCid(cid) {
  var s = String(cid || '').replace(/\D/g, '');
  if (!s) return '';
  if (s.length !== 13) return 'เลขประจำตัวประชาชนมี ' + s.length + ' หลัก ไม่ใช่ 13 หลัก';
  var sum = 0;
  for (var i = 0; i < 12; i++) sum += parseInt(s.charAt(i), 10) * (13 - i);
  if (((11 - (sum % 11)) % 10) !== parseInt(s.charAt(12), 10)) {
    return 'เลขประจำตัวประชาชนไม่ผ่านการตรวจสอบหลักสุดท้าย';
  }
  return '';
}

/* ---------------------------------------------------------- หน้าเวชระเบียน */

function renderDetail(hn) {

function programCard(p) {
  var total = 183, used = null;
  if (p.start_date) {
    var a = String(p.start_date).split('-'), b = new Date();
    used = Math.round((b - new Date(a[0], a[1] - 1, a[2])) / 86400000);
    if (used < 0) used = 0;
    if (used > total) used = total;
  }
  var pct = used === null ? 0 : Math.round((used / total) * 100);

  return '<div class="card"><h2>สถานะโปรแกรม</h2>' +
    (used === null ? '<p style="color:var(--muted);margin:0 0 14px">ยังไม่ได้กำหนดวัน Start</p>' :
      '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:10px">' +
      '<span style="font-size:24px;font-weight:600" class="num">' + used + '</span>' +
      '<span style="color:var(--muted);font-size:13px" class="num">จาก ' + total + ' วัน</span></div>' +
      '<div class="progress" style="margin-bottom:14px"><span style="width:' + pct + '%"></span></div>') +
    '<dl class="kv">' +
    kv('วัน Start', thDate(p.start_date)) +
    kv('ครบ 6 เดือน', thDate(p.imc_end_date)) +
    kv('สถานะ 6 เดือน', p.six_month_status) +
    kv('จำนวนครั้งที่ได้ PT', p.pt_visit_count) +
    kv('รูปแบบโปรแกรม', p.imc_program) +
    (p.status === 'closed' ? kv('เหตุจบโปรแกรม', p.dc_reason) : '') +
    '</dl></div>';
}

function infoCard(p) {

/**
 * กราฟเส้นแสดงพัฒนาการคะแนน BI พร้อมเส้นเกณฑ์ 15 คะแนน
 * เห็นได้ทันทีว่าผู้ป่วยข้ามเกณฑ์เข้าโปรแกรมตอนไหน
 */
function biChart(list) {
  if (list.length < 2) return '';
  var W = 700, H = 160, L = 34, R = 690, max = BOOT.biMax;
  var y = function (v) { return H - (Number(v) / max) * (H - 10); };
  var x = function (i) { return L + (i / (list.length - 1)) * (R - L); };

  var grid = [0, 5, 10, 15, 20].map(function (v) {
    return '<line x1="' + L + '" y1="' + y(v).toFixed(1) + '" x2="' + R + '" y2="' + y(v).toFixed(1) +
      '" stroke="' + (v === 0 ? '#dfe3e8' : '#eef1f4') + '" stroke-width="1"></line>' +
      '<text x="' + (L - 10) + '" y="' + (y(v) + 4).toFixed(1) + '" text-anchor="end" font-size="11" fill="#98a2ac">' + v + '</text>';
  }).join('');

  var pts = list.map(function (a, i) { return x(i).toFixed(1) + ',' + y(a.total).toFixed(1); }).join(' ');

  var dots = list.map(function (a, i) {
    return '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(a.total).toFixed(1) + '" r="4.5" ' +
      'fill="#37aaaf" stroke="#ffffff" stroke-width="2"></circle>';
  }).join('');

  var labels = list.map(function (a, i) {
    return '<text x="' + x(i).toFixed(1) + '" y="182" text-anchor="middle" font-size="11" fill="#8a95a1">' +
      'ครั้งที่ ' + esc(a.seq) + '</text>';
  }).join('');

  var lastIdx = list.length - 1;

  return '<svg viewBox="0 0 700 196" style="width:100%;height:190px;display:block;margin-bottom:14px" ' +
    'role="img" aria-label="กราฟคะแนน Barthel Index จาก ' + esc(list[0].total) + ' เป็น ' + esc(list[lastIdx].total) + '">' +
    grid +
    '<line x1="' + L + '" y1="' + y(15).toFixed(1) + '" x2="' + R + '" y2="' + y(15).toFixed(1) +
      '" stroke="#c2340c" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.5"></line>' +
    '<text x="' + (R - 4) + '" y="' + (y(15) - 6).toFixed(1) + '" text-anchor="end" font-size="11" fill="#c2340c">เกณฑ์เข้า IMC</text>' +
    '<polyline points="' + pts + '" fill="none" stroke="#37aaaf" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round"></polyline>' +
    dots + labels +
    '<text x="' + x(lastIdx).toFixed(1) + '" y="' + (y(list[lastIdx].total) - 12).toFixed(1) + '" ' +
      'text-anchor="middle" font-size="13" font-weight="600" fill="#1f2933">' + esc(list[lastIdx].total) + '</text>' +
    '</svg>';
}

/** รวมคะแนนสดขณะกรอก และบอกทันทีว่าเข้าเกณฑ์ IMC หรือไม่ */
function updateBiSummary() {
  var form = $('#bi-form');
  var total = 0, done = 0;

  BOOT.biItems.forEach(function (item) {
    var v = form.elements[item.key].value;
    var box = document.getElementById('bi-item-' + item.key);
    var max = item.options.length - 1;

    Array.prototype.forEach.call(box.querySelectorAll('.bi-opt'), function (o) {
      o.classList.toggle('picked', o.querySelector('input').checked);
    });

    if (v !== '') {
      total += parseInt(v, 10);
      done++;
      box.classList.add('done');
      document.getElementById('bi-score-' + item.key).textContent = v + ' / ' + max + ' คะแนน';
    } else {
      box.classList.remove('done');
      document.getElementById('bi-score-' + item.key).textContent = 'ยังไม่ได้เลือก';
    }
  });

  var n = BOOT.biItems.length;
  document.getElementById('bi-total').textContent = total;
  document.getElementById('bi-progress').style.width = Math.round((done / n) * 100) + '%';
  document.getElementById('bi-progress-text').textContent = done + ' จาก ' + n + ' ข้อ';

  var complete = (done === n);
  document.getElementById('bi-save').disabled = !complete;

  var el = document.getElementById('bi-verdict');
  if (!complete) {
    el.innerHTML = '<span class="chip chip-warn">เหลืออีก ' + (n - done) + ' ข้อ</span>';
    return;
  }

  var multi = form.elements.multiple_impairment.checked;
  var eligible = total < 15 || multi;
  var ctf = total >= 12 ? 'ติดสังคม' : (total >= 5 ? 'ติดบ้าน' : 'ติดเตียง');
  el.innerHTML =
    '<span class="chip ' + (eligible ? 'chip-brand' : '') + '">' +
    (eligible ? 'เข้าโปรแกรม IMC' : 'ไม่เข้าเกณฑ์ IMC') + '</span>' +
    '<span class="chip">CTF: ' + ctf + '</span>';
}

        '<h2 style="color:var(--warn)">ยังไม่มีผู้ดูแลระบบ</h2>' +
        '<p style="margin:0 0 4px;color:var(--body);line-height:1.6">' +
        'ตอนนี้ยังไม่มีใครถูกตั้งเป็นผู้ดูแลระบบ ทุกคนที่ลงทะเบียนไว้จึงเข้าหน้านี้ได้ชั่วคราว ' +
        'กดปุ่มด้านล่างเพื่อตั้งตัวเองเป็นผู้ดูแล แล้วช่องทางชั่วคราวนี้จะปิดทันที</p>' +
        '<div class="btn-row"><button class="btn btn-primary" id="claim-admin">' +
        'ตั้ง ' + esc(BOOT.user.email) + ' เป็นผู้ดูแลระบบ</button></div></div>';
    }

    html += '<div class="card"><h2>เพิ่มผู้ใช้งาน</h2>' +
      '<form id="user-form"><div class="grid">' +
      field({ k: 'email', l: 'อีเมล Google', t: 'email', req: true, ph: 'name@gmail.com' }) +
      field({ k: 'name', l: 'ชื่อ-ตำแหน่ง', t: 'text', ph: 'เช่น สมศรี (พยาบาล)' }) +
      field({ k: 'role', l: 'สิทธิ์', t: 'select', o: BOOT.vocab.ROLE, req: true }) +
      '</div><div class="btn-row"><button type="submit" class="btn btn-primary">เพิ่มผู้ใช้</button></div>' +
      '</form>' +
      '<p style="color:var(--muted);font-size:13px;margin:14px 0 0;line-height:1.6">' +
      'ระบบจะแชร์ไฟล์ Google Sheet ให้ในสิทธิ์ผู้แก้ไขอัตโนมัติ ' +
      'ถ้าแชร์ไม่สำเร็จจะขึ้นสถานะเตือนไว้ในตารางด้านล่าง</p></div>';

    html += '<div class="card flush"><div class="table-wrap"><table class="cards"><thead><tr>' +
      '<th>อีเมล</th><th>ชื่อ</th><th>สิทธิ์</th><th>สถานะ</th><th>การเข้าถึงไฟล์</th>' +
      '</tr></thead><tbody>' +
      users.map(function (u) {
        var isSelf = (u.email.toLowerCase() === meEmail);
        return '<tr style="cursor:default">' +
          '<td class="head"><strong>' + esc(u.email) + '</strong>' +
            (isSelf ? ' <span class="chip chip-sq">คุณ</span>' : '') + '</td>' +
          '<td data-l="อีเมล" class="hn-cell">' + esc(u.email) +
            (isSelf ? ' <span class="chip chip-sq">คุณ</span>' : '') + '</td>' +
          '<td data-l="ชื่อ" class="name-cell">' + esc(u.name || '—') + '</td>' +
          '<td data-l="สิทธิ์">' +
            (isSelf ? '<span class="chip chip-brand">ผู้ดูแลระบบ</span>'
              : '<select class="u-role" data-email="' + esc(u.email) + '" autocomplete="off">' +
                BOOT.vocab.ROLE.map(function (r) {
                  return '<option value="' + r + '"' + (r === u.role ? ' selected' : '') + '>' +
                    (r === 'admin' ? 'ผู้ดูแลระบบ' : 'ผู้ใช้ทั่วไป') + '</option>';
                }).join('') + '</select>') +
          '</td>' +
          '<td data-l="สถานะ">' +
            (isSelf ? '<span class="chip chip-brand">ใช้งานอยู่</span>'
              : '<label class="check"><input type="checkbox" class="u-active" ' +
                'data-email="' + esc(u.email) + '"' + (u.active ? ' checked' : '') + '>' +
                '<span>' + (u.active ? 'ใช้งานอยู่' : 'ปิดการใช้งาน') + '</span></label>') +
          '</td>' +
          '<td data-l="ไฟล์">' + fileAccessCell(u) + '</td></tr>';
      }).join('') +
      '</tbody></table></div></div>';

    html += '<div class="card"><h2>สิทธิ์แต่ละระดับ</h2><dl class="kv">' +
      kv('ผู้ใช้ทั่วไป', 'ลงทะเบียนเคส ประเมิน BI บันทึกการติดตาม และดูข้อมูลทั้งหมด') +
      kv('ผู้ดูแลระบบ', 'ทำได้ทุกอย่างเหมือนผู้ใช้ทั่วไป และเพิ่มหรือปิดสิทธิ์ผู้ใช้ในหน้านี้') +
      '</dl></div>';

    main().innerHTML = html;

    var claim = document.getElementById('claim-admin');
    if (claim) {
      claim.addEventListener('click', function () {
        claim.disabled = true; claim.textContent = 'กำลังตั้งค่า…';
        call('apiClaimAdmin').then(function (r) {
          BOOT.user.isAdmin = true;
          BOOT.user.noAdminYet = false;
          BOOT.user.role = 'admin';
          toast('ตั้ง ' + r.email + ' เป็นผู้ดูแลระบบแล้ว');
          renderSettings();
        }).catch(function (err) { claim.disabled = false; fail(err); renderSettings(); });
      });
    }

    $('#user-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var data = readForm(e.target);
      data.active = 'TRUE';
      var btn = e.target.querySelector('button[type=submit]');
      btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
      call('apiSaveUser', data).then(function (r) {
        if (r.shared) {
          toast('เพิ่ม ' + r.email + ' และแชร์ไฟล์ให้แล้ว');
        } else {
          toast('เพิ่ม ' + r.email + ' แล้ว แต่แชร์ไฟล์ไม่สำเร็จ: ' + r.shareError, true);
        }
        renderSettings();
      }).catch(function (err) {
        btn.disabled = false; btn.textContent = 'เพิ่มผู้ใช้';
        fail(err);
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('.u-share'), function (el) {
      el.addEventListener('click', function () {
        el.disabled = true; el.textContent = 'กำลังแชร์…';
        call('apiShareFile', el.getAttribute('data-email')).then(function (r) {
          toast('แชร์ไฟล์ให้ ' + r.email + ' แล้ว');
          renderSettings();
        }).catch(function (err) { el.disabled = false; el.textContent = 'แชร์ไฟล์ให้'; fail(err); });
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('.u-role, .u-active'), function (el) {
      el.addEventListener('change', function () {
        var email = el.getAttribute('data-email');
        var row = users.filter(function (u) { return u.email === email; })[0];
        var data = {
          email: email,
          name: row.name,
          role: el.classList.contains('u-role') ? el.value : row.role,
          active: (el.classList.contains('u-active') ? el.checked : row.active) ? 'TRUE' : 'FALSE'
        };
        call('apiSaveUser', data).then(function () {
          toast('อัปเดต ' + email + ' แล้ว');
          renderSettings();
        }).catch(function (err) { fail(err); renderSettings(); });
      });
    });
  }).catch(fail);
}

/* ---------------------------------------------------------- ภาพรวมงาน */

function renderDashboard() {
  busy();
  call('apiDashboard').then(function (d) {
    var html = '<div class="page-head"><div class="head-text"><h1>ภาพรวมงาน IMC</h1>' +
      '<span class="sub">' + esc(BOOT.org) + '</span></div></div>';

    html += '<div class="stats">' +
      stat(d.total, 'ผู้ป่วยทั้งหมด') +
      stat(d.imc, 'เข้าโปรแกรม IMC', d.total ? Math.round(d.imc / d.total * 100) + '% ของทั้งหมด' : '') +
      stat(d.active, 'กำลังดูแล', 'จบแล้ว ' + d.closed) +
      stat(d.avgGain === null ? '—' : (d.avgGain > 0 ? '+' : '') + d.avgGain, 'คะแนน BI เพิ่มเฉลี่ย',
        'ดีขึ้น ' + d.improved + ' ราย') +
      '</div>';

    html += '<div class="cols"><div>';

    if (d.months.length) {
      var maxCount = Math.max.apply(null, d.months.map(function (m) { return m.count; }).concat([1]));
      html += '<div class="card"><h2>ผู้ป่วยเข้าโปรแกรมใหม่รายเดือน' +
        '<span class="sub">นับจากวัน Start</span></h2><div class="bars">' +
        d.months.map(function (m) {
          var p = m.month.split('-');
          var label = TH_MONTHS[parseInt(p[1], 10) - 1] + ' ' + String(parseInt(p[0], 10) + 543).slice(-2);
          return '<div class="bar" title="' + esc(label) + ' · ' + m.count + ' ราย">' +
            '<span class="val num">' + m.count + '</span>' +
            '<div class="track"><div class="fill" style="height:' +
              Math.max(Math.round((m.count / maxCount) * 100), 2) + '%"></div></div>' +
            '<span class="lbl">' + esc(label) + '</span></div>';
        }).join('') + '</div></div>';
    }

    html += '</div><div>';

    var sum = d.imc + d.noImc;
    html += '<div class="card"><h2>ผลการคัดกรอง</h2>' +
      (sum ?
        '<div class="split">' +
        '<i style="width:' + (d.imc / sum * 100) + '%"></i>' +
        '<i style="width:' + (d.noImc / sum * 100) + '%"></i>' +
        '</div>' +
        '<div class="legend">' +
        legendRow('var(--brand)', 'เข้าเกณฑ์ IMC', d.imc, sum) +
        legendRow('#c9d2d9', 'ไม่เข้าเกณฑ์', d.noImc, sum) +
        '</div>'
        : '<div class="empty">ยังไม่มีผลคัดกรอง</div>') +
      '</div>';

    html += '<div class="card"><h2>นัดหมายที่ใกล้ถึง</h2>' +
      (d.upcoming && d.upcoming.length
        ? d.upcoming.map(function (u) {
            var when = u.days_left === 0 ? 'วันนี้' : (u.days_left === 1 ? 'พรุ่งนี้' : thDate(u.date));
            return '<div class="list-row" onclick="go(\'detail\',\'' + esc(u.hn) + '\')">' +
              '<span class="avatar row">' + esc(initials(u.name)) + '</span>' +
              '<span class="who"><b>' + esc(u.name || u.hn) + '</b>' +
              '<small>' + esc(u.program || 'นัดติดตาม') + '</small></span>' +
              '<span class="when num' + (u.days_left <= 1 ? ' soon' : '') + '">' + esc(when) + '</span>' +
              '</div>';
          }).join('')
        : '<div class="empty">ไม่มีนัดหมายที่บันทึกไว้ล่วงหน้า</div>') +
      '</div>';

    html += '</div></div>';

    main().innerHTML = html;
  }).catch(fail);
}

function stat(v, k, side) {
  return '<div class="stat">' +
    '<div class="k">' + esc(k) + '</div>' +
    '<div><span class="v num">' + esc(v) + '</span>' +
    (side ? '<span class="side num">' + esc(side) + '</span>' : '') + '</div></div>';
}

function legendRow(color, label, n, sum) {
  return '<div class="legend-row">' +
    '<span class="sw" style="background:' + color + '"></span>' +
    '<span>' + esc(label) + '</span>' +
    '<b class="num">' + n + '</b>' +
    '<span class="pct num">' + Math.round(n / sum * 100) + '%</span></div>';
}

boot();
</script>
