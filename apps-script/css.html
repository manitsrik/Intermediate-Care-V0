<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Charmonman:wght@400;700&display=swap">
<style>
/*
  สีทั้งชุดมาจากสไตล์ชีตจริงของ krabihospital.go.th
  #3fbbc0 สีหลักของเว็บโรงพยาบาล · #37aaaf แถบบนสุด · #ecf8f9 พื้นอ่อน
  brand-deep เป็นสีเดียวกันแบบเข้ม ใช้กับพื้นที่ที่มีตัวหนังสือสีขาว
  เพราะตัวหนังสือขาวบน #37aaaf ได้ค่าความต่างแค่ 2.4:1 ต่ำกว่าเกณฑ์อ่านง่าย
*/
:root {
  --brand: #3fbbc0;
  --brand-strong: #37aaaf;
  --brand-ink: #207175;
  --brand-deep: #175f63;
  --brand-soft: #ecf8f9;
  --brand-line: #c5e8ea;
  --brand-tint: #f0fafb;

  --bg: #f5fafb;
  --surface: #ffffff;
  --line: #e4e8ec;
  --line-soft: #f1f4f6;
  --text: #1f2933;
  --body: #3d4852;
  --muted: #6b7885;
  --faint: #8a95a1;

  --ok: #12a05c;
  --ok-soft: #e8f8ef;
  --warn: #c2340c;
  --warn-soft: #fdece7;

  --radius: 12px;
  --radius-lg: 16px;
  --sidebar-w: 256px;
  --topbar-h: 74px;

  /* สีการ์ดสถิติ ตัวหนังสือเข้มพอให้อ่านบนพื้นอ่อนได้ทุกใบ */
  --c1-bg: #e6f7ef; --c1-line: #c7ecda; --c1: #17a06a;
  --c2-bg: #e8f1fe; --c2-line: #cfe1fb; --c2: #2f7fe4;
  --c3-bg: #fdf1e3; --c3-line: #f7e0c2; --c3: #e08a1e;
  --c4-bg: #efeafd; --c4-line: #ddd3fa; --c4: #6d4fd8;
}

/* ตัวเขียนลายมือ ใช้เฉพาะข้อความประดับ ไม่ใช้กับข้อมูลผู้ป่วย */
.script { font-family: "Charmonman", "IBM Plex Sans Thai", cursive; }

* { box-sizing: border-box; }

/* .scrim ตั้ง display: flex ไว้ ซึ่งชนะกฎ hidden ที่เบราว์เซอร์มีมาให้ ต้องย้ำเอง */
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "IBM Plex Sans Thai", "Sarabun", "TH Sarabun New",
               "Leelawadee UI", "Noto Sans Thai", Thonburi, Tahoma, sans-serif;
  font-size: 14px;
  line-height: 1.55;
}

.num { font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------------ shell */

.shell { display: flex; min-height: 100vh; }

.content { flex-grow: 1; display: flex; flex-direction: column; min-width: 0; }

main { flex-grow: 1; padding: 18px 26px 32px; max-width: 1240px; width: 100%; }

.loading { color: var(--muted); padding: 48px 0; text-align: center; }

/* ---------------------------------------------------------------- sidebar */

.sidebar {
  width: var(--sidebar-w); flex: none;
  background: linear-gradient(180deg, #17454c 0%, #113940 55%, #0d2f35 100%);
  display: flex; flex-direction: column;
  padding: 18px 12px 22px;
  position: sticky; top: 0; height: 100vh; overflow: hidden;
}

/*
  โลโก้อยู่คอลัมน์ซ้าย ข้อความทั้งหมดอยู่คอลัมน์ขวาเรียงชิดกันเป็นบล็อกเดียว
  ถ้าปล่อยชื่อหน่วยงานไว้นอกคอลัมน์ข้อความ มันจะไปเริ่มที่ขอบซ้ายไม่ตรงกับชื่อระบบ
*/
/*
  ความกว้างช่องข้อความต้องพอดีกับความยาวตัวหนังสือจริง
  ถ้าปล่อยให้ช่องกว้างกว่าคำว่า "กลุ่มงานเวชกรรมฟื้นฟู" จะเหลือช่องว่างขวามือเสมอ
  ไม่ว่าจะขยายตัวอักษรแค่ไหน จึงบีบขอบซ้ายขวาเข้ามาให้ตัวหนังสือเต็มกรอบ
*/
.brand {
  display: flex; align-items: flex-start; gap: 10px;
  background: none; border: 0; padding: 6px 0 24px; cursor: pointer;
  font-family: inherit; text-align: left; color: inherit; width: 100%;
}
/* ข้อความกินพื้นที่ที่เหลือทั้งหมด และทุกบรรทัดเริ่มที่ขอบเดียวกันใต้ชื่อระบบ */
/* ลูกทุกตัวต้องกว้างเท่าข้อความจริง ไม่ใช่ยืดเต็มกล่อง ไม่งั้น fitBrandText วัดความกว้างไม่ได้ */
.brand-text {
  display: flex; flex-direction: column; align-items: flex-start;
  flex: 1; min-width: 0; padding-top: 2px;
}
.brand-text strong {
  color: #fff; font-size: 27px; font-weight: 700; line-height: 1.06; letter-spacing: .4px;
}
/*
  ขนาดที่เขียนไว้นี้เป็นแค่ค่าตั้งต้น fitBrandText() ใน js.html จะวัดความกว้างจริง
  แล้วขยายให้แต่ละบรรทัดชนขอบขวาพอดี ชื่อหน่วยงานมาจาก Config เปลี่ยนได้ทุกเมื่อ
  ถ้าตั้งขนาดตายตัวจะพอดีแค่กับข้อความชุดเดียว
*/
.brand-full {
  color: #d9f0f1; font-size: 19px; line-height: 1.3; margin-top: 3px; max-width: 100%;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.brand-org {
  display: flex; flex-direction: column; align-items: flex-start;
  color: #92c8ca; font-size: 18px; line-height: 1.32; margin-top: 7px; max-width: 100%;
}
.brand-org span { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-mark {
  width: 44px; height: 44px; flex: none; border-radius: 12px;
  background: #fff; color: var(--brand-ink);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600; letter-spacing: .4px;
  box-shadow: 0 3px 10px rgba(0,0,0,.18);
}
.brand-mark.sm {
  width: 28px; height: 28px; border-radius: 8px; font-size: 11px;
  background: var(--brand); color: #fff; box-shadow: none;
}

.sidenav { display: flex; flex-direction: column; gap: 4px; }
.navitem {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: 11px; border: 0;
  background: none; color: #b6d9db; cursor: pointer;
  font-family: inherit; font-size: 14px; width: 100%; text-align: left;
}
.navitem:hover { background: rgba(255,255,255,.07); color: #fff; }
.navitem.active {
  background: var(--brand); color: #fff; font-weight: 500;
  box-shadow: 0 4px 14px rgba(63,187,192,.32);
}
.navitem svg { flex: none; }

/* ข้อความประดับท้ายเมนู ไม่ใช่ข้อมูล จึงซ่อนได้เมื่อจอเตี้ยโดยไม่เสียอะไร */
.side-art {
  margin-top: auto; padding: 20px 4px 4px;
  border-top: 1px solid rgba(255, 255, 255, .1);
}
.art-script {
  font-family: "Charmonman", cursive;
  color: #d5ecec; font-size: 27px; line-height: 1.18; margin: 0; opacity: .95;
}
.art-sub { color: #8cc2c4; font-size: 12px; margin: 12px 0 0; line-height: 1.5; }

@media (max-height: 780px) { .side-art { display: none; } }

/* วงกลมอักษรย่อ ใช้ทั้งในตาราง หน้าเวชระเบียน และแถบบน */
.avatar {
  width: 30px; height: 30px; flex: none; border-radius: 50%;
  background: var(--brand-soft); color: var(--brand-ink);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600;
}
.avatar.sm { width: 28px; height: 28px; font-size: 11px; }
.avatar.lg { width: 52px; height: 52px; font-size: 15px; }
.avatar.row { width: 34px; height: 34px; }

/* ----------------------------------------------------------------- topbar */

.topbar {
  height: var(--topbar-h); flex: none;
  display: flex; align-items: center; gap: 14px;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding: 0 26px; position: sticky; top: 0; z-index: 30;
}

.search {
  display: flex; align-items: center; gap: 10px;
  background: #f3f7f8; border: 1px solid transparent; border-radius: 999px;
  padding: 0 18px; height: 42px; flex-grow: 1; max-width: 660px; color: var(--faint);
}
.search:focus-within { border-color: var(--brand-line); background: #fff; }
.search input {
  border: 0; background: none; padding: 0; height: 100%;
  font-size: 14px; color: var(--text);
}
.search input:focus { outline: 0; }

.top-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; position: relative; }

.ic-btn {
  width: 42px; height: 42px; flex: none; border: 0; border-radius: 12px;
  background: none; color: var(--muted); cursor: pointer; position: relative;
  display: inline-flex; align-items: center; justify-content: center;
}
.ic-btn:hover { background: var(--brand-soft); color: var(--brand-ink); }
.badge {
  position: absolute; top: 4px; right: 4px; min-width: 18px; height: 18px;
  border-radius: 999px; background: var(--warn); color: #fff;
  font-size: 11px; font-weight: 600; line-height: 18px; padding: 0 5px;
  border: 2px solid var(--surface); box-sizing: content-box;
}

.userchip {
  display: flex; align-items: center; gap: 10px;
  background: none; border: 0; border-radius: 12px; padding: 5px 8px 5px 5px;
  cursor: pointer; font-family: inherit; color: inherit; margin-left: 4px;
}
.userchip:hover { background: var(--brand-soft); }
.userchip .avatar { width: 40px; height: 40px; font-size: 14px; background: var(--brand); color: #fff; }
.uc-text { display: flex; flex-direction: column; line-height: 1.3; text-align: left; }
.uc-text b { font-size: 14px; font-weight: 500; }
.uc-text small { font-size: 12px; color: var(--muted); }

.dropdown {
  position: absolute; top: calc(100% + 8px); right: 0; z-index: 40;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 12px 34px rgba(16,24,40,.14); padding: 8px; min-width: 244px;
}
.dd-head { padding: 10px 12px 12px; border-bottom: 1px solid var(--line-soft); margin-bottom: 6px; }
.dd-head b { display: block; font-size: 14px; font-weight: 500; }
.dd-head small { color: var(--muted); font-size: 12px; word-break: break-all; }
.dd-item {
  display: flex; align-items: center; gap: 11px; width: 100%;
  background: none; border: 0; border-radius: 10px; padding: 11px 12px;
  font-family: inherit; font-size: 14px; color: var(--body); cursor: pointer; text-align: left;
}
.dd-item:hover { background: var(--brand-tint); color: var(--brand-ink); }
.dd-item svg { flex: none; color: var(--brand-ink); }

.app-foot {
  font-family: "Charmonman", cursive;
  color: #a9b6bd; font-size: 16px; text-align: right;
  padding: 4px 34px 22px; margin-top: -14px;
}

/* หัวกับท้ายกระดาษมีไว้ใช้ตอนพิมพ์เท่านั้น บนจอมีแถบบนกับเมนูซ้ายบอกอยู่แล้ว */
.letterhead, .print-foot { display: none; }

/* แถบบนสำหรับจอเล็ก ซ่อนไว้บนจอใหญ่เพราะมี sidebar อยู่แล้ว */
.mobilebar { display: none; }
.icon-btn {
  width: 36px; height: 36px; border: 0; border-radius: 50%;
  background: rgba(255,255,255,.16); color: #fff;
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
}

.mask-banner {
  background: var(--warn-soft); color: var(--warn);
  font-size: 13px; text-align: center; padding: 6px 16px;
  border-bottom: 1px solid #f7dbd1;
}

/*
  แถบบอกว่าเน็ตหลุด ใช้สีเดียวกับแถบโหมดทดสอบเพราะเป็นคำเตือนเหมือนกัน
  ขึ้นค้างไว้ตลอดที่ยังออฟไลน์ ไม่ใช่เด้งแล้วหาย ผู้ใช้จะได้ไม่กดบันทึกทิ้งไว้
  แล้วเข้าใจว่าข้อมูลลงชีตแล้ว
*/
.net-banner {
  background: var(--warn-soft); color: var(--warn);
  font-size: 13px; text-align: center; padding: 6px 16px;
  border-bottom: 1px solid #f7dbd1;
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.net-banner::before {
  content: ''; width: 7px; height: 7px; border-radius: 50%;
  background: currentColor; flex: none;
}

/* --------------------------------------------------------------- bottomnav */

.bottomnav { display: none; }

/* ------------------------------------------------------------------ pieces */

/*
  หัวเรื่องของทุกหน้าใช้แถบไล่เฉดชุดเดียวกัน
  เริ่มที่สีพื้นหลังหน้าเว็บพอดี ขอบซ้ายจึงกลืนหายไป แล้วไล่ไปจบที่เขียวจางทางขวา
  ไม่มีเส้นกรอบ ไม่มีเงา ตัวหนังสือเป็นสีเข้มตามปกติเพราะพื้นอ่อนมาก
*/
.page-head {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  border-radius: 14px; padding: 10px 18px; margin-bottom: 12px;
  background: linear-gradient(103deg, var(--bg) 0%, #f2fbfc 42%, #eaf8f9 74%, #e2f5f6 100%);
  /* ตรึงความสูงให้ทุกหน้าเท่ากัน ไม่งั้นหน้าที่มีปุ่มหรือกล่องวันที่จะสูงกว่าหน้าที่มีแต่ข้อความ */
  min-height: 62px;
}
.page-head h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.2px; line-height: 1.3; }
.page-head .sub { font-size: 12px; color: var(--muted); line-height: 1.4; }
.page-head .spacer { margin-left: auto; }
.head-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }

.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 20px 22px; margin-bottom: 16px;
  box-shadow: 0 1px 2px rgba(16,24,40,.04);
}
.card > h2 { font-size: 15px; font-weight: 600; margin: 0 0 14px; }
.card > h2 .sub { font-weight: 400; color: var(--faint); font-size: 12px; margin-left: 8px; }
.card.flush { padding: 0; overflow: hidden; }
.retry-row { margin-top: 14px; }

.back {
  display: inline-flex; align-items: center; gap: 7px;
  background: none; border: 0; padding: 0 0 14px; cursor: pointer;
  font-family: inherit; font-size: 13px; color: var(--muted);
}

/* ------------------------------------------------------------------ forms */

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; }
.grid .full { grid-column: 1 / -1; }

label.field { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); }
label.field .req { color: var(--warn); font-style: normal; }
/* คำอธิบายใต้ช่องกรอก สำหรับช่องที่ผลของมันไปโผล่ที่หน้าอื่น */
label.field .field-hint { font-size: 12px; color: var(--faint); line-height: 1.5; }

input, select, textarea {
  font-family: inherit; font-size: 14px; color: var(--text);
  padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px;
  background: #fff; width: 100%;
}
input:focus, select:focus, textarea:focus {
  outline: 2px solid var(--brand-soft); border-color: var(--brand-strong);
}
textarea { min-height: 68px; resize: vertical; }

.btn {
  font-family: inherit; font-size: 14px; padding: 10px 18px;
  border-radius: 9px; border: 1px solid var(--line); background: #fff;
  color: var(--body); cursor: pointer;
}
.btn:hover { background: var(--bg); }
.btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 500; }
.btn-primary:hover { background: var(--brand-strong); }
.btn-primary:disabled { background: #e7ebee; border-color: #e7ebee; color: var(--faint); cursor: not-allowed; }
.btn-danger { color: var(--warn); border-color: #f3cfc4; }
.btn-sm { padding: 6px 12px; font-size: 13px; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }

/* ------------------------------------------------------------------ table */

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 13px 20px; border-bottom: 1px solid var(--line-soft); }
th { color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; background: #fafdfd; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--brand-tint); }
tbody tr:last-child td { border-bottom: 0; }
.table-wrap { overflow-x: auto; }

.cell-person { display: flex; align-items: center; gap: 11px; }
.cell-person .who { display: flex; flex-direction: column; line-height: 1.35; }
.cell-person .who b { font-weight: 500; }
.cell-person .who small { font-size: 12px; color: var(--faint); }

.bi-cell { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.bi-cell .from { color: var(--faint); }
.bi-cell .to { font-weight: 600; font-size: 15px; }

.chip {
  display: inline-block; font-size: 12px; padding: 3px 11px; border-radius: 999px;
  background: #f4f6f7; color: var(--muted); border: 1px solid var(--line); white-space: nowrap;
}
.chip-brand { background: var(--brand-soft); color: var(--brand-ink); border-color: var(--brand-line); }
.chip-flat { background: #f1f3f5; border-color: transparent; }
.chip-ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip-warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip-sq { border-radius: 6px; padding: 2px 8px; font-size: 11px; }

.filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.filters input { min-width: 240px; flex: 1; }
.filters select { width: auto; }

/* ธงงานค้าง หนึ่งรายค้างได้หลายเรื่องพร้อมกัน ปล่อยให้ตกบรรทัดเองเมื่อช่องแคบ */
.todo-flags { display: inline-flex; flex-wrap: wrap; gap: 4px; }
/* วันที่ตกบรรทัดแล้วอ่านยาก และดันทุกแถวในตารางให้สูงขึ้นตาม */
td.date-cell { white-space: nowrap; }

.empty { text-align: center; color: var(--muted); padding: 40px 16px; }
.count-line { color: var(--faint); font-size: 13px; margin: 4px 0 0; }

/* --------------------------------------------------------------- BI form */

.progress { height: 7px; border-radius: 999px; background: #eceff2; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--brand); border-radius: 999px; }

.bi-item { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px; }
.bi-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.bi-no {
  width: 26px; height: 26px; flex: none; border-radius: 7px;
  background: #eceff2; color: var(--muted);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600;
}
.bi-item.done .bi-no { background: var(--brand); color: #fff; }
.bi-en { font-weight: 600; font-size: 15px; }
.bi-score { margin-left: auto; font-size: 13px; color: var(--faint); }
.bi-item.done .bi-score { color: var(--brand-ink); font-weight: 600; }
.bi-th { margin: 0 0 12px; color: var(--muted); font-size: 13px; }

.bi-options { display: flex; flex-direction: column; gap: 8px; }
.bi-opt {
  display: flex; align-items: flex-start; gap: 11px;
  border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px;
  cursor: pointer; font-size: 14px; color: var(--body); line-height: 1.5;
}
.bi-opt:hover { border-color: var(--brand-line); background: var(--brand-tint); }
.bi-opt input { width: auto; margin: 3px 0 0; flex: none; accent-color: var(--brand); }
.bi-opt .score { width: 18px; flex: none; color: var(--faint); font-weight: 600; }
.bi-opt.picked { border: 1.5px solid var(--brand-strong); background: var(--brand-tint); color: var(--text); }
.bi-opt.picked .score { color: var(--brand-ink); }

.bi-summary {
  position: sticky; bottom: 0; z-index: 5;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 18px; margin-top: 16px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  box-shadow: 0 -2px 12px rgba(16,24,40,.06);
}
.bi-total { font-size: 28px; font-weight: 600; letter-spacing: -.5px; }
.bi-total small { font-size: 13px; font-weight: 400; color: var(--muted); }
.bi-verdict { display: flex; gap: 8px; flex-wrap: wrap; }

.check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; }
.check input { width: auto; accent-color: var(--brand); }

/* -------------------------------------------------------------- detail */

.patient-head { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.patient-head h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.2px; }
.patient-meta { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
.patient-meta .dot { color: #cdd4da; }

.cols { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; align-items: start; }

/*
  ส่วนล่างของแดชบอร์ด กราฟกินคอลัมน์กว้าง โดนัทกับกล่องรายการอยู่คอลัมน์แคบ
  ซึ่งเป็นความกว้างที่พอดีตัวของมัน เอาไปวางครึ่งจอแล้วจะดูโล่ง

  ปัญหาเดิมคือคอลัมน์ซ้ายมีกล่องเดียว เลยเตี้ยกว่าฝั่งขวาจนเหลือช่องว่างเป็นพืด
  แก้ด้วยการให้กราฟยืดสูงเต็มแถวแทนที่จะย่อตามเนื้อหา พื้นที่ที่เคยว่าง
  จึงกลายเป็นกราฟที่อ่านง่ายขึ้น ไม่ใช่ช่องโหว่

  แยกคลาสจาก .cols เพราะหน้าเวชระเบียนใช้ .cols อยู่คนละแบบ
*/
.dash-row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 12px; align-items: start; }
.dash-row > div > .panel:last-child { margin-bottom: 0; }

/*
  ทุกกล่องสูงตามเนื้อหาจริง ไม่มีการยืดให้เท่ากัน

  เคยให้กราฟยืดเต็มความสูงของแถวเพื่อไม่ให้เหลือช่องว่างใต้กราฟ แต่พอคอลัมน์ขวา
  มีหลายกล่องและกล่องต้องจัดการยาวขึ้น กราฟก็ถูกดึงให้สูงตามจนผิดสัดส่วน
  มีไม่กี่แท่งแต่สูงเป็นครึ่งจอ แก้ด้วยการกระจายกล่องให้สองฝั่งสูงใกล้กันเองแทน
*/

.kv { display: grid; grid-template-columns: 140px 1fr; gap: 10px 14px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }

.timeline { display: flex; flex-direction: column; }
.tl-item { display: grid; grid-template-columns: 20px 1fr; gap: 13px; }
.tl-rail { display: flex; flex-direction: column; align-items: center; }
.tl-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--brand); margin-top: 6px; }
.tl-dot.past { background: #c9d2d9; }
.tl-line { width: 1.5px; flex-grow: 1; background: var(--line); }
.tl-body { padding-bottom: 18px; display: flex; flex-direction: column; gap: 3px; }
.tl-date { font-size: 13px; font-weight: 500; }
.tl-note { color: var(--muted); }

/* ------------------------------------------------------------- dashboard */

/* กล่องวันที่ ใช้เฉพาะหัวหน้าแดชบอร์ด */
.dash-date {
  margin-left: auto; flex: none;
  display: flex; align-items: center; gap: 9px;
  background: rgba(255, 255, 255, .72); border-radius: 10px; padding: 7px 13px;
  font-size: 12.5px; color: var(--body);
}
.dash-date svg { flex: none; color: var(--brand-ink); }
.dash-date span { display: block; white-space: nowrap; }
.dash-date .time { color: var(--muted); font-size: 12px; }

/* ------------------------------------------------------------- stat cards */

/*
  ไม่ตรึงไว้ที่ 4 คอลัมน์ ถ้าจอแคบจนการ์ดบางกว่า 220px ให้ลดจำนวนคอลัมน์เอง
  ดีกว่าบีบให้ครบสี่ใบจนป้ายชื่อแตกเป็นสามบรรทัด
*/
.stat-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px; margin-bottom: 12px;
}
.stat-card {
  display: flex; align-items: center; gap: 13px;
  border-radius: 15px; border: 1px solid; padding: 12px 15px;
}
.stat-card .ico {
  width: 40px; height: 40px; flex: none; border-radius: 50%; color: #fff;
  display: inline-flex; align-items: center; justify-content: center;
}
/*
  เดิมจองที่ไว้สองบรรทัดเสมอ เพื่อให้การ์ดสี่ใบเรียงระนาบกันแม้ป้ายยาวไม่เท่ากัน
  ตอนนี้เหลือสามใบและป้ายสั้นบรรทัดเดียวทุกใบ ที่จองไว้จึงกลายเป็นช่องว่างเปล่า
*/
.stat-card .k {
  font-size: 13px; color: var(--body); font-weight: 500; margin: 0 0 2px;
  line-height: 1.3;
}
.stat-card .v { font-size: 31px; font-weight: 700; letter-spacing: -1.1px; line-height: 1.05; }
.stat-card .sub { font-size: 12.5px; color: var(--muted); }
/* ท่อนหนึ่งของบรรทัดรอง ห้ามตัดกลางท่อน ดู subParts() ใน js.html */
.nb { white-space: nowrap; }

/* ตัวเลขหลักกับบรรทัดรองอยู่แถวเดียวกัน จัดชิดเส้นฐานเดียวกันจะได้ไม่ลอย */
.v-row { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
.stat-figure { flex: 1; min-width: 0; }

/* ป้ายเทียบเดือนก่อนชิดขวา ซ้อนสองบรรทัดให้สูงพอ ๆ กับฝั่งซ้าย */
.stat-foot {
  display: flex; flex-direction: column; align-items: flex-end; gap: 3px;
  flex: none; margin-left: auto; text-align: right;
}
.stat-chip {
  background: rgba(255, 255, 255, .92); border-radius: 999px;
  padding: 4px 11px; font-size: 12px; font-weight: 600;
  box-shadow: 0 1px 2px rgba(16, 24, 40, .05);
}
.stat-after { font-size: 11.5px; color: var(--muted); }

.s1 { background: var(--c1-bg); border-color: var(--c1-line); }
.s1 .ico { background: var(--c1); box-shadow: 0 4px 10px rgba(23, 160, 106, .28); }
.s1 .stat-chip { color: var(--c1); }
/*
  ชั้นสี s2 (ฟ้า) ว่างอยู่ เคยเป็นใบ "เข้าโปรแกรม IMC" ที่ตัดออกเพราะซ้ำกับโดนัท
  การ์ดชุดนี้ใช้เฉพาะบนแดชบอร์ด หน้ารายงานตั้งใจไม่ใช้ ดู outcomePanel() ใน js.html
*/
.s3 { background: var(--c3-bg); border-color: var(--c3-line); }
.s3 .ico { background: var(--c3); box-shadow: 0 4px 10px rgba(224, 138, 30, .28); }
.s3 .stat-chip { color: #b5700f; }
.s4 { background: var(--c4-bg); border-color: var(--c4-line); }
.s4 .ico { background: var(--c4); box-shadow: 0 4px 10px rgba(109, 79, 216, .28); }
.s4 .stat-chip { color: var(--c4); }

/* ----------------------------------------------------------------- panels */

.panel {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-lg); padding: 15px 18px; margin-bottom: 12px;
  box-shadow: 0 1px 2px rgba(16,24,40,.04);
}
.panel-head { display: flex; align-items: center; gap: 11px; margin-bottom: 13px; flex-wrap: wrap; }
.panel-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
.panel-head .sub { display: block; font-size: 12px; color: var(--faint); font-weight: 400; }
.panel-ico { color: var(--brand); display: inline-flex; flex: none; }
.panel-link {
  margin-left: auto; background: none; border: 0; cursor: pointer; font-family: inherit;
  font-size: 13px; color: var(--brand-ink); display: inline-flex; align-items: center; gap: 5px;
}

.seg { margin-left: auto; display: flex; background: #f2f5f6; border-radius: 10px; padding: 3px; }
.seg button {
  border: 0; background: none; border-radius: 8px; padding: 6px 14px; cursor: pointer;
  font-family: inherit; font-size: 12.5px; color: var(--muted);
}
.seg button.on { background: var(--brand); color: #fff; font-weight: 500; }

/* ------------------------------------------------------------------ chart */

.chart { display: flex; gap: 14px; }
.y-axis {
  display: flex; flex-direction: column; justify-content: space-between;
  height: 236px; padding-bottom: 24px; box-sizing: border-box;
  font-size: 12px; color: var(--faint); text-align: right; flex: none; min-width: 26px;
}
.plot { position: relative; flex-grow: 1; height: 236px; min-width: 0; }
.gridlines {
  position: absolute; left: 0; right: 0; top: 0; bottom: 24px;
  display: flex; flex-direction: column; justify-content: space-between;
}
.gridlines i { border-top: 1px solid var(--line-soft); }

/*
  แท่งกราฟใช้ความสูงเป็นเปอร์เซ็นต์ จึงต้องมีกล่องที่สูงแน่นอนเป็นตัวอ้างอิง
  ถ้าให้แท่งอยู่ในกล่องที่สูงตามเนื้อหา เปอร์เซ็นต์จะคำนวณไม่ได้และแท่งจะแบนหมด
*/
.bars {
  position: absolute; left: 0; right: 0; top: 0; bottom: 24px;
  display: flex; align-items: flex-end; gap: 14px;
}
/* หนึ่งงวดมีสองแท่ง เข้าใหม่อยู่ซ้าย จบโปรแกรมอยู่ขวา */
.bcol { flex: 1; height: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 4px; min-width: 0; }
.bar {
  flex: 1 1 0; max-width: 38px; min-width: 0; position: relative; min-height: 3px;
  background: var(--brand); border-radius: 7px 7px 0 0;
}
/* งวดที่ยอดเป็นศูนย์ ไม่ต้องเหลือตอแท่งไว้ให้เข้าใจผิดว่ามีหนึ่งราย */
.bar.zero { min-height: 0; background: transparent; cursor: default; }

/* แท่งเข้าใหม่แบ่งชั้นตามผลคัดกรอง เรียงจากล่างขึ้นบน สีชุดเดียวกับโดนัทผลการคัดกรอง */
.bar-in { display: flex; flex-direction: column-reverse; background: none; }
.bar-in > i { display: block; width: 100%; flex: none; }
.bar-in > i:last-child { border-radius: inherit; }
.seg-imc { background: var(--brand); }
.seg-noimc { background: #e3e9ec; }
.seg-other { background: #cfd6dc; }
.bar-out, .seg-out { background: #8f9fd4; }

.chart-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line-soft); font-size: 11.5px; color: var(--muted); }
.chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart-legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.bar .val {
  position: absolute; top: -21px; left: 50%; transform: translateX(-50%);
  font-size: 13px; font-weight: 600; color: var(--text);
}
.bar .val-out { top: -18px; font-size: 11px; color: var(--muted); }
.x-axis { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 14px; }
.x-axis span { flex: 1; text-align: center; font-size: 12px; color: var(--muted); min-width: 0; overflow: hidden; }

/* ------------------------------------------------------------------ donut */

/*
  โดนัทกับคำอธิบายอยู่แถวเดียวกันเสมอ ไม่ให้ตกบรรทัด
  โดนัทจึงต้องย่อตามความกว้างการ์ด ถ้าตรึงไว้ 148px พอการ์ดแคบลงจะไม่เหลือที่ให้คำอธิบาย
*/
.donut-wrap { display: flex; align-items: center; gap: 16px; flex-wrap: nowrap; }
.donut {
  width: 38%; min-width: 88px; max-width: 148px; aspect-ratio: 1;
  border-radius: 50%; position: relative; flex: none;
}
.donut::after { content: ''; position: absolute; inset: 14%; border-radius: 50%; background: var(--surface); }
.donut-mid {
  position: absolute; inset: 0; z-index: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2;
}
.donut-mid b { font-size: 24px; font-weight: 700; letter-spacing: -.5px; }
.donut-mid small { font-size: 11px; color: var(--muted); }
.legend { display: flex; flex-direction: column; gap: 13px; flex: 1; min-width: 0; }
.legend-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
.legend-row .sw { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.legend-row .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend-row b { margin-left: auto; font-weight: 600; }
.legend-row .pct { color: var(--faint); width: 38px; text-align: right; flex: none; }

/* --------------------------------------------------------------- นัดหมาย */

.list-row { display: flex; align-items: center; gap: 11px; padding: 9px 0; cursor: pointer; }
.list-row + .list-row { border-top: 1px solid var(--line-soft); }
.list-row .who { display: flex; flex-direction: column; line-height: 1.35; min-width: 0; }
.list-row .who b { font-size: 13px; font-weight: 500; }
.list-row .who small { font-size: 12px; color: var(--faint); }
.list-row .when { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
.list-row .when.soon { color: var(--warn); }

.empty-art { text-align: center; padding: 16px 10px 6px; }
.empty-art svg { color: #c3cfd4; }
.empty-art p { color: var(--muted); font-size: 13px; margin: 12px 0 14px; }

/* ---------------------------------------------------------------- รายงาน */

/*
  ตัวกรองของหน้ารายงานมีเจ็ดช่อง มากกว่าแดชบอร์ดที่มีสาม
  ตรึงไว้สี่คอลัมน์แบบเดิมจะเหลือช่องโหว่ท้ายแถว ให้แพ็กเองตามความกว้างที่มี
*/
/*
  หัวหน้ารายงานมีสามชั้นในกรอบเดียว ชื่อหน้ากับปุ่ม / ขอบเขตที่กำลังดู / ตัวกรอง
  ชั้นตัวกรองกินเต็มความกว้างด้วย flex-basis 100% จึงตกลงมาเป็นแถวของตัวเองเสมอ
*/
.rep-head { padding-bottom: 13px; }
.rep-head .head-text { flex: 1 1 260px; gap: 2px; }

/* ปุ่มส่งออกชิดขวาในหัวหน้า ตรงที่เคยเป็นช่องว่างเปล่าข้างชื่อหน้า */
.rep-actions, .head-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
.rep-actions .btn, .head-actions .btn { display: inline-flex; align-items: center; gap: 7px; }

.rep-filters {
  flex: 1 0 100%; margin-top: 11px; padding-top: 12px;
  border-top: 1px solid rgba(31, 141, 146, .15);
}
/*
  เจ็ดช่องแบ่งความกว้างที่เหลือเท่า ๆ กัน ไม่ตรึงจำนวนคอลัมน์แบบตารางของแดชบอร์ด
  ซึ่งพอเกินสี่ช่องจะตกแถวเป็นบล็อกไม่เท่ากัน ส่วนปุ่มล้างกว้างตามข้อความของมันเอง

  ใช้ flex-basis 0 ให้ทุกช่องยืดจากศูนย์เท่ากัน ไม่ใช่จองความกว้างตั้งต้นไว้ก่อน
  ถ้าจองไว้ ผลรวมของช่องจะเกินแถวจนดันปุ่มล้างตกไปอยู่บรรทัดใหม่ตัวเดียวโดด ๆ
  ส่วน min-width กันไม่ให้บีบจนป้ายยาวอย่าง "ปีงบ (นับจากวัน Start)" แตกสองบรรทัด
*/
.rep-selects { display: flex; flex-wrap: wrap; align-items: end; gap: 9px 10px; }
.rep-selects .area-field { flex: 1 1 0; min-width: 120px; }
.rep-selects .area-clear { flex: none; margin-left: 2px; white-space: nowrap; }

/*
  แถบตัวเลขผลลัพธ์ อยู่ในการ์ดขาวใบเดียวเหมือนการ์ดอื่นบนหน้านี้
  ไม่ใช่กระเบื้องสีแบบแดชบอร์ด เหตุผลเขียนไว้ที่ outcomePanel() ใน js.html

  เส้นคั่นเป็นขอบซ้ายของทุกช่องแล้วดึงกลับ 1px ให้เส้นของช่องแรกไปอยู่นอกกรอบ
  ซึ่ง overflow: hidden ตัดทิ้งให้ วิธีนี้ได้ผลกับแถวที่ตกลงมาบรรทัดใหม่ด้วย
  เพราะช่องแรกของแถวนั้นก็อยู่ที่ขอบซ้ายเหมือนกัน จึงไม่ต้องรู้ว่าตัดแถวตรงไหน
  ระยะห่างแนวนอนใช้ padding ของแต่ละช่องแทน gap ไม่งั้นการดึงกลับจะไม่ตรงเส้น
*/
.outcome { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 18px 0; overflow: hidden; }
.outcome-fig { padding: 0 18px; border-left: 1px solid var(--line-soft); margin-left: -1px; min-width: 0; }
.fig-v { font-size: 27px; font-weight: 700; letter-spacing: -1px; line-height: 1.1; color: var(--brand-ink); }
.fig-k { font-size: 13px; font-weight: 500; color: var(--body); margin: 3px 0 4px; }
.fig-m { font-size: 12px; color: var(--muted); line-height: 1.55; }
.fig-chip {
  display: inline-block; margin-top: 7px; margin-right: 5px; padding: 2px 9px; border-radius: 999px;
  background: var(--brand-soft); color: var(--brand-ink); font-size: 11.5px; font-weight: 600;
}
/*
  ตัวเลขที่มาจากคนไม่กี่ราย ทำให้จางลงและติดป้ายไว้ ดูรายละเอียดที่ thinBase() ใน js.html
  ไม่ซ่อนตัวเลขทิ้ง เพราะสองรายก็ยังเป็นข้อมูล แค่ต้องไม่อ่านเป็นภาพของทั้งกลุ่ม
*/
.fig-thin .fig-v { color: var(--faint); }
.fig-warn { background: var(--warn-soft); color: var(--warn); }
/* บรรทัดปิดท้ายแผง เป็นบริบทของทุกช่องพร้อมกัน จึงกินความกว้างเต็มใต้เส้นคั่น */
.outcome-prev {
  margin-top: 15px; padding-top: 12px; border-top: 1px solid var(--line-soft);
  font-size: 12px; color: var(--muted);
}

.rep-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.hbars { display: flex; flex-direction: column; gap: 14px; }
/*
  ทั้งแถวเป็นปุ่ม กดแล้วเห็นว่าตัวเลขนั้นมาจากใครบ้าง
  รายงานที่ชี้กลับไปหาคนไข้ไม่ได้ก็จบที่การอ่านอย่างเดียว
*/
.hbar-row {
  display: grid; grid-template-columns: 1fr auto; gap: 5px 10px;
  width: 100%; padding: 0; border: 0; background: none; cursor: pointer;
  font: inherit; font-size: 13px; text-align: left; color: inherit;
}
.hbar-row .lbl { color: var(--body); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar-row .n { color: var(--muted); font-size: 12px; white-space: nowrap; }
.hbar-row:hover .lbl, .hbar-row:focus-visible .lbl { color: var(--brand-ink); }
.hbar-row:hover .n, .hbar-row:focus-visible .n { color: var(--brand-ink); }
/* แถวยุบหางไม่มีแท่ง จึงต้องมีเส้นคั่นบอกว่าเป็นคนละชนิดกับแถวข้อมูล */
.hbar-more { border-top: 1px solid var(--line-soft); padding-top: 11px; color: var(--muted); }
.hbar-more .lbl { color: var(--muted); }
/*
  แท่งเดิมสูง 9px สีอ่อนบนรางสีอ่อน ค่าความต่างน้อยจนดูเป็นสีเทาไปหมด
  ดันสามอย่างพร้อมกันทีละนิด สูงขึ้น รางเข้มขึ้น และแท่งเข้มขึ้นหนึ่งขั้น
  ได้ผลดีกว่าดันอย่างใดอย่างหนึ่งจนแรงเกิน
*/
.hbar-track { grid-column: 1 / -1; height: 11px; border-radius: 999px; background: #e4eaed; overflow: hidden; }
/* เป็น span ต้องบอกให้เป็น block ชัด ๆ ไม่งั้น width กับ min-width ไม่มีผล */
.hbar-fill { display: block; height: 100%; border-radius: 999px; background: #38b2b7; min-width: 3px; }
/*
  สองการ์ดที่มีลำดับความรุนแรงในตัว (การกระจายคะแนน BI กับกลุ่ม ADL)
  ใช้เฉดเดียวกันไล่จากเข้มไปอ่อน เข้มคือพึ่งพาคนอื่นมากที่สุด สีจึงสื่อความหมายจริง
  การ์ดอื่นอย่างหอผู้ป่วยหรือเหตุจบไม่มีลำดับ จึงคงสีเดียวไว้ตามเดิม
*/
.hbar-fill.sev-3 { background: #1f8d92; }
.hbar-fill.sev-2 { background: #38b2b7; }
.hbar-fill.sev-1 { background: #7bd0d3; }
.hbar-fill.sev-0 { background: #a9e0e2; }

/* ปุ่มหลายตัวบนหัวการ์ดเดียว ต้องจับกลุ่มก่อน ไม่งั้นแต่ละตัวแย่งกันดันไปชิดขวา */
.panel-tools { margin-left: auto; display: inline-flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.panel-tools .panel-link { margin-left: 0; }

/* ตัวเลขในตารางเทียบชิดขวา หลักหน่วยจะได้ตรงกันทุกแถว กวาดตาเทียบได้เร็ว */
.ta-r { text-align: right; }
/*
  แถวที่คะแนนไม่ดีขึ้น เน้นด้วยแถบซ้ายอย่างเดียว ไม่ระบายพื้นทั้งแถว
  เพราะตารางนี้ยาว ถ้าระบายพื้นครึ่งตารางจะกลายเป็นสีเตือนจนไม่เหลือความหมาย

  ติดไว้ทั้งช่องหัวการ์ดและช่องชื่อ เพราะคนละช่องกันที่โผล่ในแต่ละขนาดจอ
  บนจอคอมช่องหัวการ์ดถูกซ่อน ถ้าติดแค่ช่องแรกตามลำดับ แถบจะหายไปทั้งแถบ
*/
tr.row-flat td.head, tr.row-flat td.name-cell { box-shadow: inset 3px 0 0 var(--warn); }

/* ยอดศูนย์ไม่ใช่ปุ่ม กดแล้วได้แต่รายชื่อเปล่า ให้เห็นว่ากดไม่ได้ตั้งแต่แรก */
.hbar-zero { cursor: default; }
.hbar-zero .lbl, .hbar-zero .n { color: var(--faint); }

/* ------------------------------------------------------------------ toast */

/* ------------------------------------------------------------------ modal */

.scrim {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(23, 44, 46, .42);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}

.modal {
  background: var(--surface); border-radius: 14px;
  padding: 26px 26px 20px; width: 100%; max-width: 420px;
  box-shadow: 0 12px 40px rgba(16, 24, 40, .18);
  text-align: center;
}
.modal-icon {
  width: 48px; height: 48px; margin: 0 auto 14px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}
.modal-icon.info { background: var(--brand-soft); color: var(--brand-ink); }
.modal-icon.success { background: var(--ok-soft); color: var(--ok); }
.modal-icon.warn { background: #fdf1e7; color: #b45309; }
.modal-icon.danger { background: var(--warn-soft); color: var(--warn); }

.modal-title { margin: 0; font-size: 17px; font-weight: 600; }
.modal-msg {
  margin: 8px 0 0; color: var(--muted); font-size: 14px; line-height: 1.6;
  white-space: pre-line; word-break: break-word;
}
.modal-actions { display: flex; gap: 10px; justify-content: center; margin-top: 22px; }
.modal-actions .btn { min-width: 108px; }
.btn-solid-danger { background: var(--warn); border-color: var(--warn); color: #fff; font-weight: 500; }
.btn-solid-danger:hover { background: #a72c0a; }

/* ------------------------------------------------- โมดัลรายการผู้ป่วย */

.sheet {
  background: var(--surface); border-radius: 16px;
  width: 100%; max-width: 660px; max-height: 84vh;
  display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 18px 50px rgba(16, 24, 40, .22);
}
.sheet-head {
  display: flex; align-items: center; gap: 11px;
  padding: 15px 16px 15px 20px; border-bottom: 1px solid var(--line); flex: none;
}
.sheet-head h2 { margin: 0; font-size: 17px; font-weight: 600; }
.sheet-count { color: var(--muted); font-size: 15px; }
.sheet-head .btn { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; }
.sheet-x {
  width: 34px; height: 34px; flex: none; border: 0; background: none; border-radius: 9px;
  cursor: pointer; color: var(--muted);
  display: inline-flex; align-items: center; justify-content: center;
}
.sheet-x:hover { background: var(--bg); color: var(--text); }

.sheet-body { overflow-y: auto; overscroll-behavior: contain; }
.sheet-row {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 20px; cursor: pointer; border-bottom: 1px solid var(--line-soft);
}
.sheet-row:hover { background: var(--brand-tint); }
.sheet-who { display: flex; flex-direction: column; line-height: 1.4; min-width: 0; }
.sheet-who b { font-size: 14px; font-weight: 500; }
.sheet-who small { font-size: 12px; color: var(--faint); }
.sheet-side { margin-left: auto; display: flex; align-items: center; gap: 10px; flex: none; }
.sheet-foot {
  padding: 10px 18px; border-top: 1px solid var(--line); flex: none;
  color: var(--faint); font-size: 12px; text-align: center;
}

/* บอกให้รู้ว่ากดได้ ไม่งั้นไม่มีใครรู้ว่ากราฟคลิกได้ */
.bcol { cursor: pointer; }
.bcol:hover .bar { filter: brightness(1.08); }
.donut { cursor: pointer; }
.legend-row { cursor: pointer; border-radius: 8px; padding: 3px 5px; margin: -3px -5px; }
.legend-row:hover { background: var(--brand-tint); }

/* ------------------------------------------------------- ตัวบอกว่ากำลังรอ

  งานอ่านใช้แถบบางด้านบนสุด ไม่บังจอ เพราะกดอย่างอื่นต่อได้ระหว่างรอ
  งานเขียนใช้กล่องคลุมทั้งจอ ขึ้นเมื่อรอเกิน 250ms เพื่อไม่ให้กะพริบตอนเร็ว
*/
.progress-top {
  position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 200;
  background: var(--brand-line); overflow: hidden;
}
.progress-top span {
  display: block; height: 100%; width: 40%; border-radius: 3px;
  background: var(--brand);
  animation: slide 1.1s ease-in-out infinite;
}
@keyframes slide {
  0%   { transform: translateX(-100%); }
  100% { transform: translateX(320%); }
}

/* โครงหน้าจอจาง ๆ ระหว่างรอข้อมูลรอบแรก */
.skeleton { display: flex; flex-direction: column; gap: 10px; }
.skel-head, .skel-row {
  border-radius: 10px;
  background: linear-gradient(90deg, #eef1f3 25%, #f6f8f9 37%, #eef1f3 63%);
  background-size: 400% 100%;
  animation: shimmer 1.4s ease-in-out infinite;
}
.skel-head { height: 42px; width: 240px; margin-bottom: 8px; }
.skel-row { height: 62px; }
@keyframes shimmer { to { background-position: -135% 0; } }

.scrim-load { background: rgba(23, 44, 46, .22); }
.loading-box {
  background: var(--surface); border-radius: 12px; padding: 18px 24px;
  display: flex; align-items: center; gap: 13px; font-size: 14px; color: var(--body);
  box-shadow: 0 8px 28px rgba(16, 24, 40, .14);
}
.spinner {
  width: 20px; height: 20px; flex: none; border-radius: 50%;
  border: 2.5px solid var(--brand-line); border-top-color: var(--brand);
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* หัวการ์ดใช้เฉพาะบนมือถือ บนจอใหญ่มีคอลัมน์ HN กับชื่ออยู่แล้ว */
table.cards td.head { display: none; }

/* ================================================================ มือถือ */

.hide-narrow { display: inline; }

@media (max-width: 900px) {
  body { font-size: 15px; }

  .sidebar { display: none; }

  .mobilebar {
    display: flex; align-items: center; gap: 12px;
    background: var(--brand-deep); padding: 12px 16px;
    position: sticky; top: 0; z-index: 20;
  }
  .mobilebar-title { color: #fff; font-weight: 600; font-size: 16px; flex-grow: 1; }

  main { padding: 14px 16px 96px; }

  /* จำนวนแท็บเปลี่ยนตามสิทธิ์ผู้ใช้ จึงให้คอลัมน์งอกตามจำนวนปุ่มเอง */
  .bottomnav {
    display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr);
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 8px 0 16px;
  }
  .tab {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: none; border: 0; padding: 6px 0; cursor: pointer;
    font-family: inherit; font-size: 11px; color: var(--faint);
  }
  .tab.active { color: var(--brand-ink); font-weight: 500; }

  .page-head { padding: 12px 15px; gap: 12px; border-radius: 13px; min-height: 66px; }
  .page-head h1 { font-size: 18px; }
  .page-head .spacer { display: none; }
  .card { padding: 15px 16px; }
  .cols { grid-template-columns: 1fr; }
  .dash-row { grid-template-columns: 1fr; }
  .grid { grid-template-columns: 1fr; }
  .kv { grid-template-columns: 120px 1fr; }

  /* ตัวอักษรต่ำกว่า 16px ทำให้ iOS ซูมหน้าจอเองทุกครั้งที่แตะช่องกรอก */
  input, select, textarea { font-size: 16px; }
  .filters { flex-direction: column; }
  .filters input, .filters select { width: 100%; min-width: 0; }

  /* นิ้วต้องการพื้นที่กดใหญ่กว่าเมาส์ */
  .btn { padding: 12px 18px; }
  .bi-opt { padding: 13px 14px; }
  .btn-row .btn { flex-grow: 1; text-align: center; }

  /* ตาราง 7 คอลัมน์เลื่อนซ้ายขวาบนมือถือไม่ไหว เปลี่ยนเป็นการ์ด */
  .card.flush { border: 0; background: none; box-shadow: none; }
  table.cards thead { display: none; }
  table.cards, table.cards tbody, table.cards tr, table.cards td { display: block; width: 100%; }
  table.cards tr {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 13px 15px; margin-bottom: 10px;
  }
  table.cards tr:hover { background: var(--surface); }
  table.cards td { border: 0; padding: 3px 0; display: flex; gap: 10px; align-items: baseline; }
  table.cards td::before {
    content: attr(data-l); color: var(--faint); font-size: 12px;
    min-width: 84px; flex: none;
  }
  table.cards td.head { display: flex; padding-bottom: 9px; }
  table.cards td.head::before { display: none; }
  table.cards td.hn-cell, table.cards td.name-cell { display: none; }
  table.cards td:last-child { border-top: 1px solid var(--line-soft); margin-top: 6px; padding-top: 9px; }
  .table-wrap { overflow-x: visible; }

  /* หน้าประเมิน BI ซ่อนแถบเมนูล่าง เพราะเป็นงานที่ต้องทำให้จบ
     ไม่ควรมีทางออกให้กดพลาดกลางคัน และเอาพื้นที่ไปให้แถบคะแนนแทน */
  body.hide-tabs .bottomnav { display: none; }
  body.hide-tabs main { padding-bottom: 16px; }
  .bi-summary { margin: 16px -16px 0; border-radius: 0; border-left: 0; border-right: 0; padding: 14px 16px 22px; }
  .bi-summary .btn { width: 100%; }

  .sheet { max-height: 90vh; border-radius: 14px; }
  .sheet-head { padding: 12px 12px 12px 15px; gap: 8px; }
  .sheet-head h2 { font-size: 15px; }
  .sheet-row { padding: 10px 15px; }

  .modal { padding: 22px 20px 18px; }
  .modal-actions { flex-direction: column-reverse; }
  .modal-actions .btn { width: 100%; }

  /* แถบบนเป็นของจอกว้าง บนมือถือใช้ mobilebar กับแถบแท็บล่างแทน */
  .topbar { display: none; }
  .app-foot { display: none; }

  .dash-date { margin: 0; font-size: 12px; padding: 7px 11px; }

  .stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  /*
    จอแคบการ์ดเหลือครึ่งความกว้าง วางไอคอน ตัวเลข และป้ายเทียบเดือนในแถวเดียวไม่พอ
    ป้ายเทียบเดือนจึงลงไปอยู่บรรทัดของตัวเอง ป้ายชื่อจะได้ไม่ถูกบีบจนตัดคำ
  */
  .stat-card { flex-wrap: wrap; }
  .stat-foot { flex: 1 1 100%; flex-direction: row; align-items: center; gap: 8px;
               margin-left: 0; margin-top: 8px; text-align: left; }
  /* จำนวนการ์ดเป็นเลขคี่ ใบสุดท้ายกินเต็มแถวแทนที่จะทิ้งช่องว่างข้างๆ */
  .stat-grid > :last-child:nth-child(odd) { grid-column: span 2; }
  .stat-card { padding: 14px 15px 13px; border-radius: 15px; }
  .stat-card .v { font-size: 28px; letter-spacing: -1px; }
  .stat-card .ico { width: 40px; height: 40px; }
  .stat-card .ico svg { width: 20px; height: 20px; }
  .stat-foot { padding-top: 10px; }

  .panel { padding: 16px; border-radius: 14px; }
  .panel-head { margin-bottom: 14px; }
  .seg { margin: 0; width: 100%; }
  .seg button { flex: 1; }

  .bars, .x-axis { gap: 7px; }
  .x-axis span { font-size: 10.5px; }
  .y-axis, .plot { height: 200px; }
  .donut-wrap { justify-content: center; }
}

/* ================================================================= พิมพ์

  ใช้ตอนกดปุ่มบันทึก PDF ตัดส่วนที่กดไม่ได้บนกระดาษออกให้หมด
  แล้วบีบทุกอย่างให้ลงกระดาษ A4 แนวนอนแผ่นเดียว
*/
@media print {
  /*
    A4 แนวตั้ง เพราะเป็นแนวที่แฟ้มเอกสารของหน่วยงานใช้ และถ่ายเอกสารต่อได้โดยไม่ต้องหมุน
    ความกว้างที่พิมพ์ได้จริงราว 725px ตัวเลขในบล็อกนี้ตั้งมาจากความกว้างนั้น

    ขอบกระดาษต้องอยู่ที่ @page ไม่ใช่ padding ของเนื้อหา

    เคยตั้งขอบเป็นศูนย์แล้วไปเว้นระยะที่ .content แทน เพื่อไม่ให้เบราว์เซอร์
    มีที่วาดหัว-ท้ายของตัวเอง แต่ padding มีผลครั้งเดียวตอนต้นเอกสาร
    แผ่นที่สองเป็นต้นไปจึงเริ่มชิดขอบกระดาษพอดี ตัวหนังสือแถวบนสุดโดนตัดครึ่ง
    ขอบของ @page มีผลกับทุกแผ่น จึงเป็นที่เดียวที่ตั้งได้ถูกต้อง

    เลขหน้าเขียนเองใน @bottom-center ไม่ต้องพึ่งท้ายกระดาษของเบราว์เซอร์
    ซึ่งพ่วงพาธ file:/// มาด้วยและย้ายที่ไม่ได้ Chrome รองรับ counter(page)
    ใน margin box แล้ว (ทดสอบแล้วว่าวาดจริงหน้าละหนึ่งครั้ง)

    กล่องอื่นตั้ง content เป็นค่าว่างไว้ เผื่อเบราว์เซอร์รุ่นที่ยอมให้ CSS
    แทนที่หัว-ท้ายของตัวเอง จะได้เหลือแต่เลขหน้าของเรา
  */
  @page {
    size: A4 portrait;
    margin: 12mm 9mm 13mm;
    @top-left { content: ""; }
    @top-center { content: ""; }
    @top-right { content: ""; }
    @bottom-left { content: ""; }
    @bottom-right { content: ""; }
    @bottom-center {
      content: "หน้า " counter(page) " / " counter(pages);
      font-family: "Sarabun", "Noto Sans Thai", system-ui, sans-serif;
      font-size: 8.5pt;
      color: #8a95a1;
    }
  }

  /* ------------------------------------------------------- หัว-ท้ายกระดาษ

    หัวกระดาษของเราเองแทนของเบราว์เซอร์ ใช้โทนสีเดียวกับแอป
    เครื่องหมายกับชื่อหน่วยงานอยู่ซ้าย ชื่อระบบกับวันที่พิมพ์อยู่ขวา
    คั่นด้วยเส้นสีแบรนด์ ให้ดูเป็นเอกสารของหน่วยงาน ไม่ใช่ภาพหน้าจอที่ปรินต์ออกมา
  */
  .letterhead {
    display: flex; align-items: center; gap: 11px;
    padding-bottom: 9px; margin-bottom: 11px;
    border-bottom: 2px solid var(--brand);
  }
  .lh-mark {
    width: 33px; height: 33px; flex: none; border-radius: 10px;
    background: var(--brand-deep); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .lh-org, .lh-meta { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; }
  .lh-org strong { font-size: 14px; font-weight: 600; color: var(--brand-deep); letter-spacing: -.2px; }
  .lh-org small { font-size: 10.5px; color: var(--muted); }
  .lh-meta { margin-left: auto; text-align: right; }
  .lh-meta strong { font-size: 11px; font-weight: 600; color: var(--brand-ink); letter-spacing: .2px; }
  .lh-meta small { font-size: 10px; color: var(--faint); }

  .print-foot {
    display: flex; justify-content: space-between; gap: 12px;
