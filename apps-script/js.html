/**
 * เรียกฟังก์ชันฝั่งเซิร์ฟเวอร์แบบ Promise
 * ถ้าได้ null กลับมาแปลว่าแปลงข้อมูลข้ามฝั่งไม่สำเร็จ ให้บอกสาเหตุตรง ๆ
 * ดีกว่าปล่อยให้ไปพังเป็น TypeError ที่อ่านไม่รู้เรื่องทีหลัง
 */
/**
 * ฟังก์ชันที่เขียนลงชีต ใช้ตัวบอกสถานะคนละแบบกับการอ่าน
 * เขียน = กล่องคลุมทั้งจอ กันกดซ้ำจนได้ข้อมูลซ้อนกัน
 * อ่าน  = แถบบางด้านบน ไม่บังจอ ผู้ใช้กดอย่างอื่นต่อได้ระหว่างรอ
 */
var WRITE_FNS = {
  apiSavePatient: 1, apiSaveBi: 1, apiSaveFollowup: 1, apiClosePatient: 1,
  apiSaveUser: 1, apiShareFile: 1, apiRevokeFile: 1, apiClaimAdmin: 1
};

function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  var writing = !!WRITE_FNS[fn];
  busyOn(writing);
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(function (result) {
        busyOff(writing);
        if (result === null || result === undefined) {
          reject(new Error('เซิร์ฟเวอร์ส่งข้อมูลกลับมาไม่ได้ (' + fn + ') ' +
            'อาจมีค่าผิดปกติในชีต กรุณาแจ้งผู้ดูแลระบบ'));
          return;
        }
        resolve(result);
      })
      .withFailureHandler(function (e) {
        busyOff(writing);
        paintNetwork_();
        reject(netError_(e, fn));
      })
      [fn].apply(null, args);
  });
}

/* --------------------------------------------------- ตัวบอกว่ากำลังโหลด */

var pendingRead = 0;
var pendingWrite = 0;
var writeTimer = null;

function busyOn(writing) {
  if (!writing) {
    pendingRead++;
    document.getElementById('progress').hidden = false;
    return;
  }
  pendingWrite++;
  document.getElementById('loading-msg').textContent = 'กำลังบันทึก…';
  // รอ 250ms ก่อนค่อยขึ้น ถ้าเซิร์ฟเวอร์ตอบเร็วกว่านั้นจะไม่ขึ้นเลย ไม่ให้กะพริบ
  if (writeTimer) return;
  writeTimer = setTimeout(function () {
    writeTimer = null;
    if (pendingWrite > 0) document.getElementById('loading').hidden = false;
  }, 250);
}

function busyOff(writing) {
  if (!writing) {
    pendingRead = Math.max(0, pendingRead - 1);
    if (!pendingRead) document.getElementById('progress').hidden = true;
    return;
  }
  pendingWrite = Math.max(0, pendingWrite - 1);
  if (pendingWrite > 0) return;
  clearTimeout(writeTimer);
  writeTimer = null;
  document.getElementById('loading').hidden = true;
}

function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function $(sel) { return document.querySelector(sel); }

/* ---------------------------------------------------------------- โมดัล */

var MODAL_ICON = {
  info: '<circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 7.6v.4"></path>',

  danger: '<circle cx="12" cy="12" r="9"></circle><path d="m9 9 6 6M15 9l-6 6"></path>'
};

var modalResolve = null;

function closeModal(result) {
  document.getElementById('modal').hidden = true;
  document.removeEventListener('keydown', modalKeys);
  var fn = modalResolve;
  modalResolve = null;
  if (fn) fn(result);
}

function modalKeys(e) {
  if (e.key === 'Escape') { e.preventDefault(); closeModal(false); }
  else if (e.key === 'Enter') { e.preventDefault(); closeModal(true); }
}

/** คืน Promise ที่ได้ true เมื่อกดปุ่มยืนยัน และ false เมื่อยกเลิกหรือกด Esc */
function openModal(opts) {
  var kind = opts.kind || 'info';
  var el = document.getElementById('modal');

  var iconBox = document.getElementById('modal-icon');
  iconBox.className = 'modal-icon ' + kind;
  iconBox.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" ' +
    'stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" ' +
    'aria-hidden="true">' + MODAL_ICON[kind] + '</svg>';

  document.getElementById('modal-title').textContent = opts.title || '';
  var msg = document.getElementById('modal-msg');
  msg.textContent = opts.message || '';
  msg.hidden = !opts.message;

  var okClass = (kind === 'danger' || kind === 'warn') ? 'btn btn-solid-danger' : 'btn btn-primary';
  document.getElementById('modal-actions').innerHTML =
    (opts.cancelText ? '<button class="btn" id="modal-cancel">' + esc(opts.cancelText) + '</button>' : '') +
    '<button class="' + okClass + '" id="modal-ok">' + esc(opts.confirmText || 'ตกลง') + '</button>';

  el.hidden = false;
  document.getElementById('modal-ok').onclick = function () { closeModal(true); };
  var cancel = document.getElementById('modal-cancel');
  if (cancel) cancel.onclick = function () { closeModal(false); };
  el.onclick = function (e) { if (e.target === el) closeModal(false); };

  document.addEventListener('keydown', modalKeys);
  setTimeout(function () {
    var ok = document.getElementById('modal-ok');
    if (ok) ok.focus();
  }, 30);

  return new Promise(function (resolve) { modalResolve = resolve; });
}

function notify(title, message, kind) {
  return openModal({ kind: kind || 'info', title: title, message: message, confirmText: 'ตกลง' });
}

function askConfirm(title, message, opts) {
  opts = opts || {};
  return openModal({
    kind: opts.kind || 'warn',
    title: title,
    message: message,
    confirmText: opts.confirmText || 'ยืนยัน',
    cancelText: opts.cancelText || 'ยกเลิก'
  });
}

/** ใช้ชื่อเดิมเพื่อไม่ต้องแก้จุดเรียกทั้งแอป แต่เปลี่ยนไปแสดงเป็นโมดัลแทน */
function toast(msg, isError) {
  return isError ? notify('ทำรายการไม่สำเร็จ', msg, 'danger')
                 : notify('บันทึกเรียบร้อย', msg, 'success');
}

function fail(e) {
  notify('เกิดข้อผิดพลาด', (e && e.message) ? e.message : String(e), 'danger');
}

function icon(name, size, stroke) {
  return '<svg width="' + (size || 18) + '" height="' + (size || 18) + '" viewBox="0 0 24 24" ' +
    'fill="none" stroke="currentColor" stroke-width="' + (stroke || 1.6) + '" ' +

var TH_MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.',
  'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

var TH_MONTHS_FULL = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
  'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];

var TH_DAYS = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];

function pad2(n) { return (n < 10 ? '0' : '') + n; }

function thDayText(t) {
  return 'วัน' + TH_DAYS[t.getDay()] + 'ที่ ' + t.getDate() + ' ' +
    TH_MONTHS_FULL[t.getMonth()] + ' ' + (t.getFullYear() + 543);
}

function thTimeText(t) { return pad2(t.getHours()) + ':' + pad2(t.getMinutes()) + ' น.'; }

/** yyyy-MM-dd เป็นวันที่แบบไทย พ.ศ. */
function thDate(iso) {
  if (!iso) return '—';
  var p = String(iso).split('-');
  if (p.length !== 3) return String(iso);
  return parseInt(p[2], 10) + ' ' + TH_MONTHS[parseInt(p[1], 10) - 1] + ' ' + (parseInt(p[0], 10) + 543);
}

/* ----------------------------------------------------------- ตัวสร้างฟอร์ม */

function field(f, value) {
  var v = (value === undefined || value === null) ? '' : value;
  var label = '<span>' + esc(f.l) + (f.req ? ' <em class="req">*</em>' : '') + '</span>';
  var cls = 'field' + (f.full ? ' full' : '');
  var input;

  if (f.t === 'select') {
    var opts = ['<option value="">— เลือก —</option>'].concat((f.o || []).map(function (o) {
      var val = (typeof o === 'object') ? o.value : o;
      return '<option value="' + esc(val) + '"' + (String(val) === String(v) ? ' selected' : '') + '>' +
        esc(val) + '</option>';
    }));
    input = '<select name="' + f.k + '" autocomplete="off"' + (f.req ? ' required' : '') + '>' + opts.join('') + '</select>';
  } else if (f.t === 'textarea') {
    input = '<textarea name="' + f.k + '">' + esc(v) + '</textarea>';
  } else if (f.t === 'checkbox') {
    return '<label class="check' + (f.full ? ' full' : '') + '">' +
      '<input type="checkbox" name="' + f.k + '"' +
      (String(v) === 'TRUE' || v === true ? ' checked' : '') + '>' +
      '<span>' + esc(f.l) + '</span></label>';
  } else {
    input = '<input type="' + (f.t || 'text') + '" name="' + f.k + '" value="' + esc(v) + '"' +
      ' autocomplete="off"' + (f.ph ? ' placeholder="' + esc(f.ph) + '"' : '') +
      (f.req ? ' required' : '') + '>';
  }
  // คำอธิบายใต้ช่อง สำหรับช่องที่ผลของมันไปโผล่ที่อื่น คนกรอกจะได้รู้ว่ากรอกแล้วเกิดอะไรขึ้น
  var hint = f.hint ? '<small class="field-hint">' + esc(f.hint) + '</small>' : '';
  return '<label class="' + cls + '">' + label + input + hint + '</label>';
}

function readForm(formEl) {
  var out = {};
  Array.prototype.forEach.call(formEl.elements, function (el) {
    if (!el.name) return;
    if (el.type === 'checkbox') out[el.name] = el.checked ? 'TRUE' : 'FALSE';
    else if (el.type === 'radio') { if (el.checked) out[el.name] = el.value; }
    else out[el.name] = el.value.trim();
  });
  return out;
}

function visibleNav() {
  return NAV.filter(function (n) { return !n.adminOnly || (BOOT && BOOT.user && BOOT.user.isAdmin); });
}

function renderNav() {
  var items = visibleNav();

  document.getElementById('sidenav').innerHTML = items.map(function (n) {
    return '<button class="navitem" data-nav="' + n.key + '" onclick="go(\'' + n.key + '\')">' +
      icon(n.icon) + '<span>' + esc(n.label) + '</span></button>';
  }).join('');

  document.getElementById('bottomnav').innerHTML = items.map(function (n) {
    return '<button class="tab" data-nav="' + n.key + '" onclick="go(\'' + n.key + '\')">' +
      icon(n.icon, 22) + '<span>' + esc(n.short) + '</span></button>';
  }).join('');
}

function go(name, param) {
  dashRequest++;
  VIEW = { name: name, param: param };
  closeDropdown();
  closeList();

  var active = NAV_OF_VIEW[name] || '';
  Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'), function (b) {
    b.classList.toggle('active', b.getAttribute('data-nav') === active);
  });
  document.getElementById('mobile-title').textContent = TITLE_OF_VIEW[name] || '';
  document.body.classList.toggle('hide-tabs', name === 'bi');

  window.scrollTo(0, 0);
  return ({
    list: renderList,
    dashboard: renderDashboard,
    followups: renderFollowups,
    settings: renderSettings,
    report: renderReport,
    patient: renderPatientForm,
    detail: renderDetail,
    bi: renderBiForm,
    fu: renderFuForm,
    close: renderCloseForm
  })[name](param);
}

function setAlerts(n) {
  var b = document.getElementById('alert-badge');
  b.textContent = n > 9 ? '9+' : String(n);

  document.getElementById('btn-alerts').title = n

}

var dropdownKind = '';

function toggleDropdown(kind, html) {
  var el = document.getElementById('dropdown');
  if (dropdownKind === kind && !el.hidden) { closeDropdown(); return; }
  el.innerHTML = html;
  el.hidden = false;
  dropdownKind = kind;
}

function closeDropdown() {
  var el = document.getElementById('dropdown');
  if (!el) return;
  el.hidden = true;
  dropdownKind = '';
}

      '<div class="dd-head"><b>' + esc(displayName(BOOT.user)) + '</b>' +
      '<small>' + esc(BOOT.user.email) + '</small></div>' +
      ddItem('pulse', 'โหลดข้อมูลใหม่', 'reloadAll()'));
  };

  document.getElementById('btn-pdf').onclick = savePdf;
  document.getElementById('sheet-close').onclick = closeList;
  document.getElementById('sheet-excel').onclick = exportSheet;
  document.getElementById('listmodal').onclick = function (e) {
    if (e.target.id === 'listmodal') closeList();
  };

  document.addEventListener('click', closeDropdown);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeDropdown();
  });
}

/**
 * เติมชื่อหน่วยงานกับวันที่ลงหัว-ท้ายกระดาษ
 *
 * ผูกกับ beforeprint ไม่ใช่เติมตอนบูตครั้งเดียว เพราะแอปเปิดค้างข้ามวันได้
 * และคนกด Ctrl+P เองก็ต้องได้วันที่ที่ถูกเหมือนกับกดปุ่มในแอป
 */
function fillPrintHeader() {
  var org = BOOT || {};
  var set = function (id, text) {
    var el = document.getElementById(id);
    if (el) el.textContent = text;
  };
  var d = new Date();
  var today = thDate(d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()));

  set('lh-place', org.orgPlace || org.org || '');
  set('lh-unit', org.orgUnit || '');
  set('lh-app', org.appName || '');
  set('lh-date', 'พิมพ์เมื่อ ' + today);
  set('pf-org', [org.orgUnit, org.orgPlace].filter(String).join(' · '));
  set('pf-date', 'จัดทำโดยระบบ ' + (org.appName || '') + ' · ' + today);

  /*
    ชื่อเอกสารกลายเป็นชื่อไฟล์ตอนกด "บันทึกเป็น PDF" และเป็นข้อความบนหัวกระดาษ
    ที่เบราว์เซอร์วาดให้ ไม่ตั้งไว้จะได้ไฟล์ชื่อ index.html ซึ่งบอกไม่ได้ว่าเอกสารอะไร

    เว้นอักขระที่ตั้งชื่อไฟล์บนวินโดวส์ไม่ได้ โดยเฉพาะขีดทับใน "รายงาน / BI"
    ใช้ขีดกลางคั่นแทน ชื่อที่ได้จึงบันทึกลงเครื่องได้ทันทีโดยไม่ต้องแก้
  */
  var name = { report: 'รายงาน IMC', dashboard: 'แดชบอร์ด IMC' }[VIEW.name] || (org.appName || 'IMC');
  document.title = [name, org.orgPlace, today].filter(String).join(' - ');
}

/*
  เติมตอนบูตด้วย ไม่ได้พึ่ง beforeprint อย่างเดียว
  เพราะการสั่งพิมพ์บางทางไม่ยิงอีเวนต์นี้ เช่นตอนแปลงเป็น PDF ด้วยเครื่องมืออัตโนมัติ
  ถ้าพึ่งอีเวนต์อย่างเดียว หัวกระดาษจะออกมาเป็นช่องว่างโดยไม่มีใครรู้
*/
window.addEventListener('beforeprint', fillPrintHeader);

/*
  บันทึกหน้าที่กำลังดูอยู่เป็น PDF ผ่านหน้าต่างพิมพ์ของเบราว์เซอร์

  ไม่ใช้ไลบรารีจับภาพหน้าจอ เพราะโดนัทผลการคัดกรองวาดด้วย conic-gradient
  ซึ่งไลบรารีพวกนั้นวาดไม่ออก จะได้วงว่างเปล่า ส่วนการพิมพ์ใช้ตัวเบราว์เซอร์เอง
  จึงได้ทุกอย่างตรงกับที่เห็นบนจอ และตัวหนังสือใน PDF ยังคัดลอกกับค้นหาได้

  หน้ารายงานพิมพ์ได้เองด้วย ไม่ใช่ถูกลากกลับไปแดชบอร์ดเหมือนเดิม
  เพราะเป็นหน้าที่ถูกพิมพ์ไปแนบรายงานบ่อยที่สุด ส่วนหน้าอื่นเป็นฟอร์มกับรายชื่อ
  ซึ่งพิมพ์ออกมาแล้วไม่ได้ใช้ จึงพากลับไปหน้าที่พิมพ์แล้วได้เรื่องแทน
*/
var PRINTABLE = ['dashboard', 'report'];

function printNow_() {
  // เผื่อเวลาให้จัดหน้าเสร็จก่อน ไม่งั้นบางทีได้กระดาษที่ยังวางของไม่ครบ
  setTimeout(function () { window.print(); }, 120);
}

/**
 * เดิมหน้าที่พิมพ์ไม่ได้จะถูกพาไปแดชบอร์ดแล้วสั่งพิมพ์ทันทีโดยไม่บอกอะไรเลย
 * คนที่กดจากหน้ารายชื่อจึงได้กระดาษเป็นแดชบอร์ดโดยไม่รู้ว่าเกิดอะไรขึ้น
 * ทางลัดยังอยู่ แต่ต้องถามก่อน และบอกทางที่ตรงกว่าให้ด้วยถ้ามี
 */
function savePdf() {
  closeDropdown();
  if (PRINTABLE.indexOf(VIEW.name) !== -1) { printNow_(); return; }

  var hint = VIEW.name === 'list'
    ? ' ถ้าต้องการรายชื่อเป็นไฟล์ ใช้ปุ่มส่งออกรายชื่อในหน้านี้ได้เลย'
    : '';
  askConfirm('หน้านี้ยังพิมพ์ไม่ได้',
    'พิมพ์ได้เฉพาะหน้าแดชบอร์ดกับหน้ารายงาน จะไปพิมพ์แดชบอร์ดแทนไหม' + hint,
    { kind: 'info', confirmText: 'ไปหน้าแดชบอร์ด' }
  ).then(function (ok) {
    if (!ok) return;
    Promise.resolve(go('dashboard')).then(printNow_);
  });
}

/** ทิ้งของที่เก็บไว้ทั้งหมดแล้ววาดหน้าปัจจุบันใหม่ ใช้ตอนสงสัยว่าเห็นข้อมูลเก่า */
function reloadAll() {
  dropCache_();
  go(VIEW.name, VIEW.param);
}

/** อักษรย่อในวงกลม ใช้ตัวพิมพ์ใหญ่เสมอ ภาษาไทยไม่มีตัวพิมพ์ใหญ่จึงไม่เปลี่ยนอะไร */
function initials(name) {
  var s = String(name || '').trim();
  return s ? s.charAt(0).toUpperCase() : '?';
}

/*
  ขยายข้อความในกล่องแบรนด์ให้ชนขอบขวาของเมนูพอดี

  วัดความกว้างจริงแล้วคำนวณขนาดตัวอักษรเอา เพราะชื่อหน่วยงานมาจาก Config
  ถ้าใครแก้เป็นชื่อที่ยาวหรือสั้นกว่านี้ ขนาดที่ตั้งตายตัวไว้จะไม่พอดีทันที
  สองบรรทัดหน่วยงานใช้ขนาดเดียวกัน คิดจากบรรทัดที่ยาวที่สุด
  ถ้าให้แต่ละบรรทัดพอดีขอบของตัวเอง บรรทัดสั้นจะกลายเป็นตัวใหญ่กว่าบรรทัดยาว
*/
var BRAND_MAX = { full: 18, org: 16.5 };

function fitLine_(el, boxWidth, maxSize, widest) {
  if (!el) return;
  el.style.fontSize = '';
  var base = parseFloat(window.getComputedStyle(el).fontSize) || 16;
  var w = widest || el.getBoundingClientRect().width;
  if (!w || !boxWidth) return;
  el.style.fontSize = Math.min(maxSize, base * boxWidth / w).toFixed(1) + 'px';
}

function fitBrandText() {
  var box = document.querySelector('.brand-text');
  if (!box) return;
  var width = box.clientWidth;
  if (!width) return;

  fitLine_(document.getElementById('app-name'), width, BRAND_MAX.full);

  var org = document.querySelector('.brand-org');
  var unit = document.getElementById('app-org-unit');
  var place = document.getElementById('app-org-place');
  if (!org || !unit) return;
  org.style.fontSize = '';
  fitLine_(org, width, BRAND_MAX.org,
    Math.max(unit.getBoundingClientRect().width, place.getBoundingClientRect().width));
}

/** ชื่อที่แสดงบนแถบบน ใช้ชื่อจริงถ้ามี ไม่งั้นใช้ส่วนหน้าของอีเมล */
function displayName(u) {
  return u.name || String(u.email || '').split('@')[0] || '—';
}

/* --------------------------------------------- ทำตัวให้เหมือนแอปติดเครื่อง

  ทำ PWA เต็มรูปแบบบน Apps Script ไม่ได้ หน้าจอจริงถูกฝังใน iframe คนละโดเมน
  กับหน้าบนสุด เบราว์เซอร์จึงไม่อ่าน manifest ให้ และ service worker ก็วางไม่ได้
  เพราะต้องเป็นไฟล์ .js แยกบนโดเมนเดียวกัน ซึ่ง HtmlService เสิร์ฟให้ไม่ได้
  ที่ทำได้คือแก้สองอาการที่ทำให้รู้สึกว่าไม่ใช่แอป คือเปิดมาแล้วจอว่างรอนาน
  กับเน็ตหลุดแล้วจอค้างโดยไม่บอกอะไร
*/

/*
  เก็บแค่ชื่อหน่วยงานที่ใช้วาดแถบข้าง ไม่เก็บข้อมูลผู้ป่วยและไม่เก็บว่าใครล็อกอิน
  เครื่องในวอร์ดเป็นเครื่องที่ใช้ร่วมกัน ข้อมูลคนไข้ค้างอยู่ในเครื่องไม่ได้
  และถ้าเก็บชื่อผู้ใช้ไว้ พอสลับบัญชีจะวาบให้เห็นชื่อคนก่อนหน้าก่อนของจริงจะมา
*/
var SHELL_KEY = 'imc.shell.v1';

function readShell_() {
  try { return JSON.parse(localStorage.getItem(SHELL_KEY)) || null; } catch (e) { return null; }
}

function saveShell_(b) {
  try {
    localStorage.setItem(SHELL_KEY, JSON.stringify({
      appName: b.appName, org: b.org, orgUnit: b.orgUnit, orgPlace: b.orgPlace
    }));
  } catch (e) { /* บางเบราว์เซอร์ปิด storage ใน iframe ข้ามโดเมน แค่ไม่ได้ของเร็วขึ้น */ }
}

function isOffline_() {
  return typeof navigator !== 'undefined' && navigator.onLine === false;
}

function paintNetwork_() {
  var el = document.getElementById('net-banner');
  if (el) el.hidden = !isOffline_();
}

var netWatched = false;

/** ขึ้นแถบเตือนค้างไว้ตลอดที่ยังออฟไลน์ ไม่ใช่เด้งแล้วหาย จะได้ไม่กดบันทึกลอย ๆ */
function watchNetwork_() {
  paintNetwork_();
  if (netWatched) return;
  netWatched = true;
  window.addEventListener('online', paintNetwork_);
  window.addEventListener('offline', paintNetwork_);
}

/**
 * ข้อความที่ Apps Script ส่งกลับมาตอนเรียกไม่สำเร็จเพราะเน็ตหลุดนั้นอ่านไม่รู้เรื่อง
 * เปลี่ยนเป็นบอกตรง ๆ ว่ายังไม่ได้บันทึก ให้ต่อเน็ตแล้วทำใหม่
 */
function netError_(e, fn) {
  if (!isOffline_()) return e;
  return new Error(WRITE_FNS[fn]
    ? 'ตอนนี้ไม่ได้ต่ออินเทอร์เน็ต ข้อมูลยังไม่ถูกบันทึก กรุณาต่อเน็ตแล้วกดบันทึกอีกครั้ง'
    : 'ตอนนี้ไม่ได้ต่ออินเทอร์เน็ต ดึงข้อมูลใหม่ไม่ได้ กรุณาต่อเน็ตแล้วลองอีกครั้ง');
}

/**
 * วาดโครงหน้าจอทันทีที่เปิด ไม่ต้องรอ apiBootstrap ที่กินเวลาหลายวินาที
 * เมนูวาดเฉพาะรายการที่ทุกคนเห็น ของผู้ดูแลระบบรอจนรู้สิทธิ์จริงก่อน
 * จะได้ไม่วาบให้เห็นเมนูที่ตัวเองกดไม่ได้
 */
function preboot() {
  var s = readShell_();
  if (s) {
    document.getElementById('app-name').textContent = s.appName || '';
    document.getElementById('app-org-unit').textContent = s.orgUnit || s.org || '';
    document.getElementById('app-org-place').textContent = s.orgPlace || '';
    fitBrandText();
  }

  renderNav();
  // boot() จบแล้วไปหน้ารายชื่อเสมอ ทำเมนูให้สว่างตรงกันไว้ก่อน จะได้ไม่ขยับทีหลัง
  Array.prototype.forEach.call(document.querySelectorAll('[data-nav="list"]'), function (b) {
    b.classList.add('active');
  });
  document.getElementById('mobile-title').textContent = TITLE_OF_VIEW.list;

  busy();
  watchNetwork_();
}

/**
 * เปิดแอปไม่ขึ้นเลยต้องมีปุ่มให้ลองใหม่ ไม่งั้นต้องปิดแท็บเปิดใหม่เอง
 * ซึ่งตอนเปิดจากไอคอนบนจอโฮมของ iOS ไม่มีแถบที่อยู่เว็บให้กดโหลดซ้ำด้วย
 */
function bootFailed(e) {
  var offline = isOffline_();
  main().innerHTML = '<div class="card">' +
    '<h2>' + (offline ? 'ไม่ได้ต่ออินเทอร์เน็ต' : 'เข้าใช้งานไม่ได้') + '</h2>' +
    '<p>' + esc(offline
      ? 'แอปต้องต่อเน็ตเพื่อดึงข้อมูลจาก Google Sheet ต่อเน็ตแล้วกดลองใหม่ได้เลย'
      : ((e && e.message) ? e.message : String(e))) + '</p>' +
    '<div class="retry-row"><button class="btn btn-primary" onclick="boot()">ลองใหม่</button></div>' +
    '</div>';
}

function boot() {
  preboot();
  call('apiBootstrap').then(function (b) {
    BOOT = b;
    saveShell_(b);
    document.getElementById('app-name').textContent = b.appName;
    document.getElementById('app-org-unit').textContent = b.orgUnit || b.org;
    document.getElementById('app-org-place').textContent = b.orgPlace || '';
    document.getElementById('user-name').textContent = displayName(b.user);
    document.getElementById('user-role').textContent = b.user.isAdmin ? 'ผู้ดูแลระบบ' : 'เจ้าหน้าที่ IMC';
    document.getElementById('btn-user').title = b.user.email;
    document.getElementById('user-initial').textContent = initials(displayName(b.user));
    document.getElementById('mask-banner').hidden = !b.maskMode;
    fillPrintHeader();
    setAlerts(b.alerts || 0);
    // apiBootstrap ส่งรายชื่อผู้ป่วยมาด้วยเลย หน้าแรกจึงคุยกับเซิร์ฟเวอร์รอบเดียว ไม่ใช่สองรอบ
    if (b.patients) { patientCache = b.patients; patientCacheAt = Date.now(); }
    renderNav();
    wireTopbar();

    // ฟอนต์เว็บมาทีหลัง ถ้าวัดก่อนฟอนต์โหลดเสร็จจะได้ความกว้างของฟอนต์สำรอง
    fitBrandText();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitBrandText);
    window.addEventListener('resize', fitBrandText);

    go('list');
  }).catch(bootFailed);
}

/* ------------------------------------------------------- หน้ารายชื่อผู้ป่วย */

var listFilter = { q: '', status: '', screening: '', todo: '' };

// แถวที่ผ่านตัวกรองอยู่ตอนนี้ ปุ่มส่งออกหยิบชุดเดียวกับที่ตาเห็นบนจอ ไม่ใช่ทั้งฐาน
var listRows = [];

/*
  หน้ารายชื่อทำหน้าที่เป็นตัวเลือกผู้ป่วยให้หน้าอื่นได้ด้วย
  กุญแจคือชื่อหน้าที่จะไปต่อเมื่อเลือกแล้ว ค่าคือข้อความบนแถบที่บอกว่ากำลังเลือกอะไรอยู่
  ว่าง = ใช้งานตามปกติ กดแถวแล้วเปิดเวชระเบียน
*/
var LIST_PICK = { fu: 'เลือกผู้ป่วยที่จะบันทึกการติดตาม' };
var listPick = '';

/**
 * ดึงรายชื่อทั้งหมดครั้งเดียวแล้วค้นหากับกรองในเครื่อง
 * เดิมพิมพ์ค้นหาหนึ่งคำคือยิงไปเซิร์ฟเวอร์หนึ่งรอบ รอหลายวินาทีต่อคำ
 * และหน้าจอถูกวาดใหม่ทั้งหน้าจนเคอร์เซอร์หลุดจากช่องค้นหาทุกครั้ง
 */
function renderList(param) {
  // โหมดเลือกผู้ป่วยติดมากับการเรียกหน้า ไม่ได้ค้างไว้เป็นสถานะ กดเมนูรายชื่อตามปกติจึงหลุดออกเอง
  var pick = param && param.pick;
  listPick = LIST_PICK[pick] ? pick : '';
  if (patientCache) {
    drawList();
    if (Date.now() - patientCacheAt > CACHE_FRESH_MS) {
      loadPatients().then(paintRows).catch(function () { /* ของเก่ายังใช้ได้ ไม่ต้องรบกวน */ });
    }
    return;
  }
  busy();
  loadPatients().then(drawList).catch(fail);
}

function loadPatients() {
  return call('apiListPatients', {}).then(function (rows) {
    patientCache = rows;
    patientCacheAt = Date.now();
    return rows;
  });
}

/** เงื่อนไขเดียวกับที่ apiListPatients เคยกรองให้ฝั่งเซิร์ฟเวอร์ */
function matchesFilter(p) {
  if (listFilter.status && String(p.status) !== listFilter.status) return false;
  if (!matchesScreening(p)) return false;
  if (!matchesTodo(p)) return false;
  var q = String(listFilter.q || '').trim().toLowerCase();
  if (!q) return true;
  return [p.hn, p.cid, p.first_name, p.last_name, p.tambon, p.dx]
    .join(' ').toLowerCase().indexOf(q) !== -1;
}

/**
 * ช่องผลคัดกรองที่ว่างคือ "ยังไม่ได้คัดกรอง" ซึ่งเป็นกลุ่มที่ต้องตามงานที่สุด
 * ต้องเลือกดูได้ ไม่ใช่มีให้เลือกแค่เข้าเกณฑ์กับไม่เข้าเกณฑ์แล้วกลุ่มนี้หายไปกลางรายชื่อ
 */
function matchesScreening(p) {
  if (!listFilter.screening) return true;
  if (listFilter.screening === 'none') return !String(p.screening_result || '').trim();
  return String(p.screening_result) === listFilter.screening;
}

/**
 * ธงงานค้างที่ติดมากับผู้ป่วยจาก displayPatient_ ฝั่งเซิร์ฟเวอร์
 * ตัวเลขบนแดชบอร์ดกับรายชื่อที่กรองตรงนี้จึงมาจากชุดเดียวกันเสมอ
 */
function matchesTodo(p) {
  var key = listFilter.todo;
  if (!key) return true;
  var flags = p.attention || [];
  if (key === 'any') return flags.length > 0;
  // ตัวเลือกที่คนเปิดตอนเช้าน่าจะใช้บ่อยที่สุด คือเรื่องที่กระทบคนไข้ ไม่ใช่ช่องที่ค้างเติม
  if (key === 'care') return todoCount(p, 'care') > 0;
  /*
    ยังไม่เคยประเมิน BI ไม่ใช่ธงงานค้าง เพราะรายที่เพิ่งลงทะเบียนเมื่อวานยังไม่ถือว่าค้าง
    แต่เป็นช่องที่ต้องตามให้ครบอยู่ดี จึงให้เลือกดูได้จากดรอปดาวน์เดียวกัน
  */
  if (key === 'nobi') return p.first_bi === '' || p.first_bi === undefined || p.first_bi === null;
  return flags.indexOf(key) !== -1;
}

/** จำนวนธงชนิดนั้นของผู้ป่วยรายหนึ่ง ชนิดกำกับไว้ที่ ATTENTION ฝั่งเซิร์ฟเวอร์ */
function todoCount(p, kind) {
  return (p.attention || []).filter(function (k) {
    return attentionOf(k).kind === kind;
  }).length;
}

/** คำเต็มกับป้ายสั้นของธงหนึ่งอัน อ่านจากรายการที่เซิร์ฟเวอร์ส่งมาตอนบูต */
function attentionOf(key) {
  var list = (BOOT && BOOT.attention) || [];
  for (var i = 0; i < list.length; i++) {
    if (list[i].key === key) return list[i];
  }
  // คีย์ที่ไม่รู้จักถือเป็นงานที่ต้องลงมือไว้ก่อน ปลอดภัยกว่าเงียบไปเป็นเรื่องรอได้
  return { key: key, kind: 'care', short: key, label: key };
}

/**
 * แถบบอกว่าตอนนี้หน้ารายชื่อถูกยืมมาใช้เลือกผู้ป่วย ไม่ใช่กำลังดูรายชื่อตามปกติ
 * ต้องมีทางถอยออกเสมอ คนที่กดมาแล้วเปลี่ยนใจจะได้ไม่ต้องเดาว่าออกจากโหมดนี้ยังไง
 */
function pickBanner() {
  if (!listPick) return '';
  return '<div class="card notice-pick">' +
    '<span><b>' + esc(LIST_PICK[listPick]) + '</b> คลิกที่ชื่อในตารางด้านล่าง ' +
    'ค้นหาหรือกรองก่อนได้</span>' +
    '<button class="btn btn-sm" onclick="cancelPick()">ยกเลิก</button></div>';
}

function cancelPick() {
  listPick = '';
  go('followups');
}

/**
 * ล้างตัวกรองทุกช่องกลับไปดูทุกราย เรียกจากหน้าว่างตอนกรองจนไม่เหลือใคร
 * ล้างช่องค้นหาบนแถบบนด้วย ไม่งั้นคำค้นเดิมจะค้างอยู่ตรงนั้นทั้งที่ตัวกรองถูกล้างไปแล้ว
 */
function clearListFilters() {
  listFilter = { q: '', status: '', screening: '', todo: '' };
  var top = document.getElementById('top-search');
  if (top) top.value = '';
  drawList();
}

function paintRows() {
  var body = document.getElementById('list-body');
  if (!body) return;   // ผู้ใช้เปลี่ยนหน้าไปแล้วระหว่างรอข้อมูลรอบใหม่

  var all = patientCache || [];
  var rows = all.filter(matchesFilter);
  var active = all.filter(function (p) { return String(p.status) !== 'closed'; }).length;
  var care = all.filter(function (p) { return todoCount(p, 'care'); }).length;
  var gaps = all.filter(function (p) { return todoCount(p, 'data'); }).length;

  listRows = rows;
  body.innerHTML = rows.map(patientRow).join('');
  document.getElementById('list-card').hidden = !rows.length;
  document.getElementById('list-empty').hidden = !!rows.length;
  // เขียนเฉพาะตอนว่างจริง ไม่ต้องประกอบข้อความใหม่ทุกครั้งที่พิมพ์ค้นหา
  if (!rows.length) document.getElementById('list-empty-text').innerHTML = emptyListText();
  document.getElementById('list-shown').textContent = rows.length ? 'แสดง ' + rows.length + ' ราย' : '';
  document.getElementById('list-export-n').textContent = rows.length + ' ราย';

  /*
    นับจากทุกรายเสมอ ไม่ใช่เฉพาะที่กรองอยู่ เพราะบรรทัดนี้เป็นภาพรวมของทั้งระบบ
    คู่กับ "ทั้งหมด" กับ "กำลังดูแล" ส่วนจำนวนที่กรองแล้วอยู่บนปุ่มส่งออกและใต้ตารางแล้ว

    แยกสองก้อนเพราะเป็นงานคนละอย่าง "มีงานค้าง" คือเรื่องที่ต้องลงมือวันนี้
    ส่วน "ข้อมูลต้องเติม" คือช่องที่ไล่เติมจากแฟ้มเก่าตอนว่างได้ ถ้ารวมเป็นเลขเดียว
    ยอดจะเกือบเท่าจำนวนผู้ป่วยทั้งหมดแล้วเอาไปวางแผนวันนี้ไม่ได้
  */
  document.getElementById('list-count').textContent =
    'ทั้งหมด ' + all.length + ' ราย · กำลังดูแล ' + active + ' ราย' +
    (care ? ' · มีงานค้าง ' + care + ' ราย' : '') +
    (gaps ? ' · ข้อมูลต้องเติม ' + gaps + ' ราย' : '');
}

/** หน้าว่างบอกด้วยว่าว่างเพราะกรองไว้หรือเพราะยังไม่มีใครในระบบ แล้วเสนอทางออกให้ตรงกัน */
function emptyListText() {
  var filtering = !!(listFilter.q || listFilter.status || listFilter.screening || listFilter.todo);
  if (filtering) {
    return 'ไม่มีผู้ป่วยตามเงื่อนไขที่กรองอยู่' +
      '<div class="btn-row" style="justify-content:center">' +
      '<button class="btn" onclick="clearListFilters()">ล้างตัวกรอง</button></div>';
  }
  return 'ยังไม่มีผู้ป่วยในระบบ' +
    '<div class="btn-row" style="justify-content:center">' +
    '<button class="btn btn-primary" onclick="go(\'patient\')">+ ลงทะเบียนเคสแรก</button></div>';
}

function patientRow(p) {
  var meta = [p.sex, p.age ? p.age + ' ปี' : ''].filter(String).join(' · ');
  return '<tr onclick="go(\'' + (listPick || 'detail') + '\',\'' + esc(p.hn) + '\')">' +
    '<td class="head"><strong>' + esc(p.hn) + '</strong> ' + esc(p.full_name || '') + '</td>' +
    '<td data-l="ผู้ป่วย" class="name-cell"><div class="cell-person">' +
      '<span class="avatar row">' + esc(initials(p.first_name)) + '</span>' +
      '<span class="who"><b>' + esc(p.full_name || '—') + '</b>' +
      '<small class="num">' + esc(p.hn) + (meta ? ' · ' + esc(meta) : '') + '</small></span>' +
    '</div></td>' +
    '<td data-l="Dx">' + esc(p.dx || '—') + '</td>' +
    '<td data-l="Ward">' + esc(p.ward || '—') + '</td>' +
    '<td data-l="วัน Start" class="num date-cell">' + esc(thDate(p.start_date)) + '</td>' +
    '<td data-l="BI">' + biCell(p.first_bi, p.latest_bi) + '</td>' +
    '<td data-l="ผลคัดกรอง">' + screeningChip(p.screening_result) + '</td>' +
    '<td data-l="สถานะ">' + statusChip(p.status) + '</td>' +
    '<td data-l="งานค้าง">' + todoCell(p) + '</td>' +
    '</tr>';
}

/**
 * ธงงานค้างของรายนั้น ใช้ป้ายสั้นเพราะช่องในตารางมีที่ให้ไม่กี่ตัวอักษร
 * คำเต็มอยู่ใน title เอาเมาส์ไปวางแล้วอ่านได้ว่าค้างเรื่องอะไรกันแน่
 *
 * ธงมาจาก displayPatient_ ฝั่งเซิร์ฟเวอร์ ป้ายบนแถวกับตัวเลขบนแดชบอร์ดจึงนับเรื่อง
 * เดียวกันเสมอ ไม่มีฝั่งไหนตีความคำว่า "ค้าง" เป็นของตัวเอง
 */
function todoCell(p) {
  var flags = p.attention || [];
  if (!flags.length) return '<span style="color:var(--faint)">—</span>';
  return '<span class="todo-flags">' + flags.map(function (k) {
    var it = attentionOf(k);
    /*
      สีส้มเก็บไว้ให้เรื่องที่กระทบคนไข้เท่านั้น ช่องที่ค้างเติมใช้สีเทา
      ของจริงมีเคสเก่าที่ไม่มีวันสิ้นสุดอยู่เกือบทุกแถว ถ้าย้อมส้มไปด้วยทั้งหมด
      ตาจะเลิกมองป้าย แล้วรายที่ต้องรีบจริงจะหายไปกลางกอง
    */
    var tone = it.kind === 'data' ? 'chip-flat' : 'chip-warn';
    return '<span class="chip ' + tone + ' chip-sq" title="' + esc(it.label) + '">' +
      esc(it.short) + '</span>';
  }).join('') + '</span>';
}

/**
 * ผู้ป่วยตามตัวกรองที่เห็นอยู่บนจอ ไม่ใช่ทั้งฐาน
 * คอลัมน์ชุดเดียวกับที่ส่งออกจากหน้ารายงานและจากโมดัลรายชื่อ
 */
function exportPatients() {
  if (!listRows.length) {
    notify('ไม่มีข้อมูลให้บันทึก', 'ตัวกรองที่เลือกอยู่ยังไม่มีผู้ป่วย', 'warn');
    return;
  }
  downloadCsv('imc-patients', patientCsvLines(listRows));
}

/** แสดงพัฒนาการเป็น "แรกรับ → ล่าสุด" พร้อมส่วนต่าง อ่านทีเดียวจบ */
function biCell(first, latest) {
  if (first === '' || first === undefined || first === null) {
    return '<span style="color:var(--faint)">ยังไม่ประเมิน</span>';
  }
  var a = Number(first), b = Number(latest);
  var diff = b - a;
  var badge = isNaN(diff) ? '' :
    (diff > 0
      ? '<span class="chip chip-ok chip-sq num">+' + diff + '</span>'
      : (diff === 0
        ? '<span class="chip chip-flat chip-sq num">0</span>'
        : '<span class="chip chip-warn chip-sq num">' + diff + '</span>'));

  return '<span class="bi-cell num"><span class="from">' + esc(a) + '</span>' +
    '<span style="color:#b6bec6">' + icon('arrow', 14, 2) + '</span>' +
    '<span class="to">' + esc(isNaN(b) ? '—' : b) + '</span>' + badge + '</span>';
}

function screeningChip(v) {
  if (v === 'IMC') return '<span class="chip chip-brand">เข้า IMC</span>';
  if (v === 'NoIMC') return '<span class="chip">ไม่เข้าเกณฑ์</span>';
  return '<span class="chip">ยังไม่ประเมิน</span>';
}

function statusChip(v) {
  return v === 'closed'
    ? '<span class="chip chip-flat">จบโปรแกรม</span>'
    : '<span class="chip chip-brand">กำลังดูแล</span>';
}

function backBtn(view, param) {
  return '<button class="back" onclick="go(\'' + view + '\'' +
    (param ? ',\'' + esc(param) + '\'' : '') + ')">' + icon('back', 15, 2) +
    '<span>ย้อนกลับ</span></button>';
}

function renderPatientForm(hn) {
  if (!hn) return drawPatientForm({});
  busy();
  call('apiGetPatient', hn)
    .then(function (d) { drawPatientForm(d.patient); })
    .catch(fail);
}

function drawPatientForm(p) {
  var isNew = !p.patient_id;
  var html = backBtn(isNew ? 'list' : 'detail', isNew ? '' : p.hn) +
    '<div class="page-head"><div class="head-text"><h1>' +
    (isNew ? 'ลงทะเบียนเคสใหม่' : 'แก้ไขข้อมูล ' + esc(p.hn)) +
    '</h1></div></div>' +
    '<form id="patient-form">' +
    '<input type="hidden" name="patient_id" value="' + esc(p.patient_id || '') + '">';

  patientSections().forEach(function (sec) {
    html += '<div class="card"><h2>' + esc(sec[0]) + '</h2><div class="grid">' +
      sec[1].map(function (f) { return field(f, p[f.k]); }).join('') +
      '</div></div>';
  });

  html += '<div class="btn-row"><button type="submit" class="btn btn-primary">บันทึก</button></div></form>';
  main().innerHTML = html;

  wirePatientArea();
  $('#patient-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var form = e.target;
    var data = readForm(form);

    var warn = validateCid(data.cid);
    var ask = warn
      ? askConfirm('เลขประจำตัวประชาชนอาจไม่ถูกต้อง', warn, { confirmText: 'บันทึกต่อ' })
      : Promise.resolve(true);

    ask.then(function (ok) {
      if (!ok) return;
      var btn = form.querySelector('button[type=submit]');
      btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
      call('apiSavePatient', data).then(function (r) {
        dropCache_(r.hn);
        return toast('บันทึกข้อมูล HN ' + r.hn + ' แล้ว').then(function () { go('detail', r.hn); });
      }).catch(function (err) {
        btn.disabled = false; btn.textContent = 'บันทึก';
        fail(err);
      });
    });
  });
}

/** ตรวจเลขบัตรประชาชนแบบหลักตรวจสอบ คืนข้อความเตือนถ้าผิด */
function wirePatientArea() {
  var form = $('#patient-form'), geo = BOOT.geography;
  if (!geo) return;
  var province = form.querySelector('[name="province"]');
  var clean = function (v) { return String(v || '').trim().replace(/^(จังหวัด|อำเภอ|ตำบล|[จอต]\.)\s*/, '').trim(); };
  var replace = function (name, options, value) {
    var old = form.querySelector('[name="' + name + '"]');
    var el = document.createElement(options ? 'select' : 'input');
    el.name = name;
    if (options) {
      var choices = options.slice();
      // เก็บค่าเดิมที่ยังต้องตรวจสอบไว้ ไม่ล้างเงียบ ๆ ตอนเปิดฟอร์ม
      if (value && choices.indexOf(value) === -1) choices.push(value);
      el.innerHTML = optionHtml('', '— ยังไม่ระบุ —', value) + choices.map(function (x) { return optionHtml(x, x, value); }).join('');
    } else { el.type = 'text'; }
    el.value = value || '';
    old.parentNode.replaceChild(el, old);
    return el;
  };
  var refreshTambon = function (reset) {
    var d = clean(form.querySelector('[name="district"]').value);
    var value = reset ? '' : clean(form.querySelector('[name="tambon"]').value);
    replace('tambon', clean(province.value) === geo.province ? (Object.prototype.hasOwnProperty.call(geo.districts, d) ? geo.districts[d] : []) : null, value);
  };
  var refreshDistrict = function (reset) {
    var value = reset ? '' : clean(form.querySelector('[name="district"]').value);
    if (clean(province.value) === geo.province && value === 'เมือง') value = geo.city;
    var district = replace('district', clean(province.value) === geo.province ? Object.keys(geo.districts) : null, value);
    district.addEventListener('change', function () { refreshTambon(true); });
    refreshTambon(reset);
  };
  province.setAttribute('list', 'province-options');
  var list = document.createElement('datalist');
  list.id = 'province-options'; list.innerHTML = '<option value="กระบี่"></option>';
  province.parentNode.appendChild(list);
  province.addEventListener('change', function () { refreshDistrict(true); });
  refreshDistrict(false);
}

function validateCid(cid) {
  var s = String(cid || '').replace(/\D/g, '');
  if (!s) return '';
  if (s.length !== 13) return 'เลขประจำตัวประชาชนมี ' + s.length + ' หลัก ไม่ใช่ 13 หลัก';
  var sum = 0;
  for (var i = 0; i < 12; i++) sum += parseInt(s.charAt(i), 10) * (13 - i);
  if (((11 - (sum % 11)) % 10) !== parseInt(s.charAt(12), 10)) {
    return 'เลขประจำตัวประชาชนไม่ผ่านการตรวจสอบหลักสุดท้าย';
  }
  return '';
}

function renderDetail(hn) {

    drawDetail(detailCache[hn]);

      if (VIEW.name === 'detail' && VIEW.param === hn) drawDetail(d);
    }).catch(function () { /* ของเก่ายังใช้ได้ ไม่ต้องรบกวน */ });
    return;
  }
  busy(4);
  loadDetail(hn).then(drawDetail).catch(fail);
}

function programCard(p) {
  var total = 183, used = null;
  if (p.start_date) {
    var a = String(p.start_date).split('-'), b = new Date();
    used = Math.round((b - new Date(a[0], a[1] - 1, a[2])) / 86400000);
    if (used < 0) used = 0;
    if (used > total) used = total;
  }
  var pct = used === null ? 0 : Math.round((used / total) * 100);

  return '<div class="card"><h2>สถานะโปรแกรม</h2>' +
    (used === null ? '<p style="color:var(--muted);margin:0 0 14px">ยังไม่ได้กำหนดวัน Start</p>' :
      '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:10px">' +
      '<span style="font-size:24px;font-weight:600" class="num">' + used + '</span>' +
      '<span style="color:var(--muted);font-size:13px" class="num">จาก ' + total + ' วัน</span></div>' +
      '<div class="progress" style="margin-bottom:14px"><span style="width:' + pct + '%"></span></div>') +
    '<dl class="kv">' +
    kv('วัน Start', thDate(p.start_date)) +
    kv('ครบ 6 เดือน', thDate(p.imc_end_date)) +
    kv('สถานะ 6 เดือน', p.six_month_status) +
    kv('จำนวนครั้งที่ได้ PT', p.pt_visit_count) +
    kv('รูปแบบโปรแกรม', p.imc_program) +
    (p.status === 'closed' ? kv('เหตุจบโปรแกรม', p.dc_reason) : '') +
    '</dl></div>';
}

function infoCard(p) {
  return '<div class="card"><h2>ข้อมูลทั่วไป</h2><dl class="kv">' +

function editBtn(view, hn, id, what) {

function timeline(list, hn) {

      '<div class="tl-rail"><div class="tl-dot' + (i ? ' past' : '') + '"></div>' +

/**
 * ข้อความของการติดตามหนึ่งครั้ง
 *
 * เดิมแสดงภาวะแทรกซ้อนอย่างเดียวถ้ามี หมายเหตุที่กรอกไว้คู่กันจะหายไปเงียบ ๆ
 * ทั้งที่หัวตารางเขียนไว้ว่าแสดงทั้งสองอย่าง
 */
function fuText(f) {
  var parts = [f.complications, f.note].filter(String);
  if (!parts.length) return '—';
  // ห่อไว้ก้อนเดียว เพราะบนมือถือช่องในตารางเป็น flex ถ้าปล่อยสองก้อนจะไปเรียงข้างกันแทนที่จะซ้อนบรรทัด
  return '<span class="fu-texts">' + parts.map(function (t) {
    return '<span class="fu-text">' + esc(t) + '</span>';
  }).join('') + '</span>';
}

/**
 * วันที่ของการติดตามหนึ่งครั้ง

/**
 * กราฟเส้นแสดงพัฒนาการคะแนน BI พร้อมเส้นเกณฑ์ 15 คะแนน
 * เห็นได้ทันทีว่าผู้ป่วยข้ามเกณฑ์เข้าโปรแกรมตอนไหน
 */
function biChart(list) {
  if (list.length < 2) return '';
  var W = 700, H = 160, L = 34, R = 690, max = BOOT.biMax;
  var y = function (v) { return H - (Number(v) / max) * (H - 10); };
  var x = function (i) { return L + (i / (list.length - 1)) * (R - L); };

  var grid = [0, 5, 10, 15, 20].map(function (v) {
    return '<line x1="' + L + '" y1="' + y(v).toFixed(1) + '" x2="' + R + '" y2="' + y(v).toFixed(1) +
      '" stroke="' + (v === 0 ? '#dfe3e8' : '#eef1f4') + '" stroke-width="1"></line>' +
      '<text x="' + (L - 10) + '" y="' + (y(v) + 4).toFixed(1) + '" text-anchor="end" font-size="11" fill="#98a2ac">' + v + '</text>';
  }).join('');

  var pts = list.map(function (a, i) { return x(i).toFixed(1) + ',' + y(a.total).toFixed(1); }).join(' ');

  var dots = list.map(function (a, i) {
    return '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(a.total).toFixed(1) + '" r="4.5" ' +
      'fill="#37aaaf" stroke="#ffffff" stroke-width="2"></circle>';
  }).join('');

  var labels = list.map(function (a, i) {
    return '<text x="' + x(i).toFixed(1) + '" y="182" text-anchor="middle" font-size="11" fill="#8a95a1">' +
      'ครั้งที่ ' + esc(a.seq) + '</text>';
  }).join('');

  var lastIdx = list.length - 1;

  return '<svg viewBox="0 0 700 196" style="width:100%;height:190px;display:block;margin-bottom:14px" ' +
    'role="img" aria-label="กราฟคะแนน Barthel Index จาก ' + esc(list[0].total) + ' เป็น ' + esc(list[lastIdx].total) + '">' +
    grid +
    '<line x1="' + L + '" y1="' + y(15).toFixed(1) + '" x2="' + R + '" y2="' + y(15).toFixed(1) +
      '" stroke="#c2340c" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.5"></line>' +
    '<text x="' + (R - 4) + '" y="' + (y(15) - 6).toFixed(1) + '" text-anchor="end" font-size="11" fill="#c2340c">เกณฑ์เข้า IMC</text>' +
    '<polyline points="' + pts + '" fill="none" stroke="#37aaaf" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round"></polyline>' +
    dots + labels +
    '<text x="' + x(lastIdx).toFixed(1) + '" y="' + (y(list[lastIdx].total) - 12).toFixed(1) + '" ' +
      'text-anchor="middle" font-size="13" font-weight="600" fill="#1f2933">' + esc(list[lastIdx].total) + '</text>' +
    '</svg>';
}

          '<span>' + esc(opt) + '</span></label>';
      }).join('') +
      '</div></div>';
  });

  html += '<div class="card"><div class="grid">' +
    field({ k: 'multiple_impairment', l: 'มี multiple impairment', t: 'checkbox', full: true },
      old ? old.multiple_impairment : '') +
    field({ k: 'note', l: 'หมายเหตุ', t: 'textarea', full: true }, old ? old.note : '') +
    '</div></div>' +
    '<div class="bi-summary">' +
    '<div class="bi-total num"><span id="bi-total">0</span><small> / ' + BOOT.biMax + ' คะแนน</small></div>' +
    '<div class="bi-verdict" id="bi-verdict"></div>' +
    '<div style="margin-left:auto"></div>' +
    '<button type="submit" class="btn btn-primary" id="bi-save" disabled>บันทึกผลประเมิน</button>' +
    '</div></form>';

  main().innerHTML = html;

  var form = $('#bi-form');
  form.addEventListener('change', updateBiSummary);
  updateBiSummary();

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var data = readForm(form);
    data.multiple_impairment = form.elements.multiple_impairment.checked;

    var missing = BOOT.biItems.filter(function (i) { return !form.elements[i.key].value; });
    if (missing.length) {
      notify('ยังประเมินไม่ครบ',
        'ขาดข้อ ' + missing.map(function (i) { return i.no; }).join(', ') +
        '\nกด ตกลง แล้วระบบจะพาไปที่ข้อแรกที่ยังไม่ได้เลือก', 'warn')
        .then(function () {
          document.getElementById('bi-item-' + missing[0].key)
            .scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
      return;
    }

    var btn = document.getElementById('bi-save');
    btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
    call('apiSaveBi', data).then(function () {
      dropCache_(data.hn);
      return toast(old ? 'แก้ไขผลประเมินแล้ว' : 'บันทึกผลประเมินเรียบร้อย')
        .then(function () { go('detail', data.hn); });
    }).catch(function (err) {
      btn.disabled = false; btn.textContent = 'บันทึกผลประเมิน';
      fail(err);
    });
  });
}

/** รวมคะแนนสดขณะกรอก และบอกทันทีว่าเข้าเกณฑ์ IMC หรือไม่ */
function updateBiSummary() {
  var form = $('#bi-form');
  var total = 0, done = 0;

  BOOT.biItems.forEach(function (item) {
    var v = form.elements[item.key].value;
    var box = document.getElementById('bi-item-' + item.key);
    var max = item.options.length - 1;

    Array.prototype.forEach.call(box.querySelectorAll('.bi-opt'), function (o) {
      o.classList.toggle('picked', o.querySelector('input').checked);
    });

    if (v !== '') {
      total += parseInt(v, 10);
      done++;
      box.classList.add('done');
      document.getElementById('bi-score-' + item.key).textContent = v + ' / ' + max + ' คะแนน';
    } else {
      box.classList.remove('done');
      document.getElementById('bi-score-' + item.key).textContent = 'ยังไม่ได้เลือก';
    }
  });

  var n = BOOT.biItems.length;
  document.getElementById('bi-total').textContent = total;
  document.getElementById('bi-progress').style.width = Math.round((done / n) * 100) + '%';
  document.getElementById('bi-progress-text').textContent = done + ' จาก ' + n + ' ข้อ';

  var complete = (done === n);
  document.getElementById('bi-save').disabled = !complete;

  var el = document.getElementById('bi-verdict');
  if (!complete) {
    el.innerHTML = '<span class="chip chip-warn">เหลืออีก ' + (n - done) + ' ข้อ</span>';
    return;
  }

  var multi = form.elements.multiple_impairment.checked;
  var eligible = total < 15 || multi;
  var adl = total >= 12 ? 'ติดสังคม' : (total >= 5 ? 'ติดบ้าน' : 'ติดเตียง');
  el.innerHTML =
    '<span class="chip ' + (eligible ? 'chip-brand' : '') + '">' +
    (eligible ? 'เข้าโปรแกรม IMC' : 'ไม่เข้าเกณฑ์ IMC') + '</span>' +
    '<span class="chip">ADL: ' + adl + '</span>';
}

/* ------------------------------------------------------- ฟอร์มติดตามผล */

/*
  พารามิเตอร์ของหน้าฟอร์มอาจเป็น HN เฉย ๆ (บันทึกรายการใหม่)
  หรือเป็นก้อนที่มีรหัสรายการที่จะแก้ และวันที่ตั้งต้น
  ฝั่งเซิร์ฟเวอร์รองรับการแก้ไขอยู่แล้ว ถ้าส่งรหัสเดิมกลับไปมันจะเขียนทับแทนการเพิ่มใหม่
*/
function formArg(param) {
  return typeof param === 'string' ? { hn: param } : (param || {});
}

/** รายการเดิมที่จะแก้ อ่านจากข้อมูลหน้าเวชระเบียนที่โหลดไว้แล้ว */
function cachedRecord(hn, listKey, idKey, id) {
  var d = detailCache[hn];
  if (!d || !id) return null;
  return (d[listKey] || []).filter(function (r) { return String(r[idKey]) === String(id); })[0] || null;
}

/**
 * ฟอร์มต้องรู้จักรายการเดิมก่อน ถึงจะรู้ว่ากำลังแก้ของเดิมหรือกำลังเพิ่มรายการใหม่
 *
 * เดิมอ่านจากเวชระเบียนที่โหลดไว้แล้วอย่างเดียว ถ้าเข้ามาจากหน้าที่ยังไม่เคยเปิด
 * เวชระเบียนรายนั้น (เช่นกดแก้ไขจากหน้าการติดตาม) จะได้ค่าว่าง แล้วกลายเป็นบันทึก
 * รายการใหม่ซ้ำขึ้นมาอีกอันโดยไม่มีอะไรเตือน จึงต้องโหลดให้ครบก่อนวาดฟอร์ม
 */
function renderFuForm(param) {
  var a = formArg(param);
  if (detailCache[a.hn]) { drawFuForm(a, detailCache[a.hn]); return; }
  busy(3);
  loadDetail(a.hn).then(function (d) {
    if (VIEW.name === 'fu') drawFuForm(a, d);
  }).catch(fail);
}

function drawFuForm(a, d) {

    // ชื่อผู้ป่วยกำกับไว้ด้วย เพราะเข้าหน้านี้จากรายการที่ต้องตามได้โดยไม่ผ่านเวชระเบียน
    '<span class="sub num">HN ' + esc(hn) + ' · ' + esc(p.full_name || '') +
    (old ? ' · ครั้งที่ ' + esc(old.seq) : '') + '</span></div></div>' +
    '<form id="fu-form"><input type="hidden" name="hn" value="' + esc(hn) + '">' +
    // ส่งรหัสรายการเดิมกลับไปด้วย เซิร์ฟเวอร์จะได้เขียนทับของเดิมแทนการเพิ่มรายการใหม่
    // ไม่ต้องส่งเลขครั้งที่ เซิร์ฟเวอร์ไล่เลขเองจากวันที่หลังบันทึกทุกครั้ง
    (old ? '<input type="hidden" name="fu_id" value="' + esc(old.fu_id) + '">' : '') +
    '<div class="card"><div class="grid">' +
    field({ k: 'fu_date', l: 'วัน เดือน ปี', t: 'date', req: true }, old ? old.fu_date : (a.date || BOOT.today)) +
    field({ k: 'fu_type', l: 'ประเภทการติดตาม', t: 'select', o: BOOT.vocab.FU_TYPE, req: true }, old ? old.fu_type : '') +
    field({ k: 'complications', l: 'ภาวะแทรกซ้อนที่พบ', t: 'textarea', full: true }, old ? old.complications : '') +
    field({ k: 'note', l: 'หมายเหตุ', t: 'textarea', full: true }, old ? old.note : '') +
    /*
      นัดครั้งถัดไปมีเฉพาะตอนบันทึกรายการใหม่ การแก้บันทึกเก่าไม่ควรไปขยับวันนัดที่ใช้อยู่

      ช่องนี้เขียนกลับไปที่วันนัด OPD ของผู้ป่วย ซึ่งเป็นช่องเดียวกับที่ธง "เลยกำหนดนัดแล้ว"
      กับรายการที่ต้องตามอ่าน ตามคนไข้เสร็จแล้วเลื่อนนัดตรงนี้ที่เดียว งานค้างจะหายไปเอง
    */

      k: 'next_appt', l: 'นัดครั้งถัดไป', t: 'date',
      hint: appt
        ? 'ตอนนี้นัดไว้ ' + thDate(appt) + ' · ใส่วันใหม่เพื่อเลื่อนนัด ปล่อยว่างถ้ายังไม่เปลี่ยน'
        : 'ยังไม่มีวันนัดในระบบ · ใส่ไว้แล้วรายนี้จะขึ้นในรายการที่ต้องตามเมื่อใกล้ถึงวัน'
    }, '')) +
    // ตรวจครั้งเดียวแล้วต้องบันทึกสองที่ ติ๊กไว้แล้วระบบพาไปหน้าประเมินต่อโดยเติมวันที่ให้

           '<span>ประเมิน BI ต่อหลังบันทึก</span></label>') +
    '</div><div class="btn-row"><button type="submit" class="btn btn-primary">บันทึก</button></div></div></form>';

  $('#fu-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var data = readForm(e.target);
    var btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'กำลังบันทึก…';

        // ไปต่อหน้าประเมินโดยพกวันที่เดิมไป จะได้ไม่ต้องกรอกซ้ำ
        return thenBi ? go('bi', { hn: data.hn, date: data.fu_date }) : go('detail', data.hn);
      });

/* ------------------------------------------------------ หน้าการติดตาม */

/*
  หน้านี้มีสองงานที่ไม่เหมือนกันวางอยู่ด้วยกัน

    ด้านบน  งานที่ต้องลงมือ - ใครถึงกำหนดต้องตามแล้วบ้าง
    ด้านล่าง สมุดบันทึก - ตามใครไปแล้วบ้าง ค้นและกรองย้อนหลังได้

  เดิมมีแต่ก้อนล่าง และตัดมาให้แค่ 60 รายการล่าสุด หน้าที่ทีมเปิดเพื่อจะตามคนไข้
  จึงตอบไม่ได้เลยว่าวันนี้ต้องตามใคร และดูของเก่าที่เกิน 60 รายการก็ไม่ได้
*/
var fuAll = [];      // ทุกรายการที่เซิร์ฟเวอร์ส่งมา
var fuRows = [];     // เฉพาะที่ผ่านตัวกรอง ใช้ตอนนับและวาดแถว
var fuDue = [];      // รายชื่อที่ถึงกำหนดต้องตาม
var fuDueAll = false;
var fuFilter = { q: '', type: '', when: '' };

/** ตัวเลือกช่วงเวลาของสมุดบันทึก เก็บคู่กันไว้ที่เดียวเพื่อให้ค่ากับป้ายไม่มีทางหลุดจากกัน */
var FU_WHEN = [
  ['', 'ทุกช่วงเวลา'],
  ['30', '30 วันล่าสุด'],
  ['90', '90 วันล่าสุด'],
  ['fy', 'ปีงบนี้'],
  ['nodate', 'ยังไม่มีวันที่']
];

/* แสดงรายชื่อที่ต้องตามเท่านี้ก่อน ที่เหลือกางดูได้ ไม่ให้ตารางบันทึกถูกดันตกจอไปตั้งแต่แรก */
var FU_DUE_SHOWN = 8;

function renderFollowups() {
  busy();
  call('apiListFollowups').then(function (d) {
    fuAll = d.rows || [];
    fuDue = d.due || [];
    drawFollowups();
  }).catch(fail);
}

function drawFollowups() {
  main().innerHTML =
    '<div class="page-head"><div class="head-text"><h1>การติดตาม</h1>' +
    '<span class="sub num" id="fu-count"></span></div>' +
    '<div class="head-actions">' +
    '  <button class="btn btn-primary" onclick="pickPatientForFu()">+ บันทึกการติดตาม</button>' +
    '</div></div>' +
    duePanel() +
    '<div class="filters">' +
    '  <input id="fu-q" autocomplete="off" placeholder="ค้นหา HN ชื่อ หรือข้อความในบันทึก" value="' + esc(fuFilter.q) + '">' +
    '  <select id="fu-type" autocomplete="off">' +
    '    <option value="">ทุกประเภท</option>' +
    (BOOT.vocab.FU_TYPE || []).map(function (t) { return optionHtml(t, t, fuFilter.type); }).join('') +
    '  </select>' +
    '  <select id="fu-when" autocomplete="off">' +
    FU_WHEN.map(function (w) { return optionHtml(w[0], w[1], fuFilter.when); }).join('') +
    '  </select>' +
    '</div>' +
    // data-l ใช้เป็นป้ายกำกับตอนตารางกลายเป็นการ์ดบนมือถือ (ดู css.html)
    // จำนวนช่องที่มองเห็นต้องเท่ากับจำนวนหัวตารางเสมอ ไม่งั้นข้อมูลจะเลื่อนคอลัมน์
    '<div class="card flush" id="fu-card"><div class="table-wrap"><table class="cards"><thead><tr>' +
    '<th>วันที่</th><th>ผู้ป่วย</th><th>ครั้งที่</th><th>ประเภท</th>' +
    '<th>ภาวะแทรกซ้อน / หมายเหตุ</th><th><span class="sr-only">แก้ไข</span></th>' +
    '</tr></thead><tbody id="fu-body"></tbody></table></div></div>' +
    '<div id="fu-empty" hidden><div class="card"><div class="empty" id="fu-empty-text"></div></div></div>' +
    '<p class="count-line num" id="fu-shown"></p>';

  // กรองในเครื่องแล้ววาดใหม่เฉพาะแถว ช่องค้นหาไม่ถูกสร้างใหม่ เคอร์เซอร์จึงอยู่ที่เดิม
  $('#fu-q').addEventListener('input', function (e) { fuFilter.q = e.target.value; paintFuRows(); });
  $('#fu-type').addEventListener('change', function (e) { fuFilter.type = e.target.value; paintFuRows(); });
  $('#fu-when').addEventListener('change', function (e) { fuFilter.when = e.target.value; paintFuRows(); });

  paintFuRows();
}

/**
 * รายชื่อที่ถึงกำหนดต้องตาม อ่านจากวันนัด OPD ช่องเดียวกับที่แดชบอร์ดกับธงงานค้างใช้
 * ทั้งสามที่จึงพูดถึงนัดเดียวกันเสมอ ไม่มีหน้าไหนตีความคำว่า "ถึงกำหนด" เป็นของตัวเอง
 */
function duePanel() {
  if (!fuDue.length) return '';

  var over = fuDue.filter(function (u) { return u.days_left < 0; }).length;
  var today = fuDue.filter(function (u) { return u.days_left === 0; }).length;
  var soon = fuDue.length - over - today;
  var shown = fuDueAll ? fuDue : fuDue.slice(0, FU_DUE_SHOWN);

  return '<div class="panel">' +
    '<div class="panel-head"><span class="panel-ico">' + icon('bell', 20, 1.9) + '</span>' +
    '<h2>ถึงกำหนดต้องตาม' +
    '<span class="sub num">' + [
      over ? 'เลยนัด ' + over + ' ราย' : '',
      today ? 'วันนี้ ' + today + ' ราย' : '',
      soon ? 'ใน ' + BOOT.dueAheadDays + ' วัน ' + soon + ' ราย' : ''
    ].filter(String).join(' · ') + '</span></h2>' +
    (fuDue.length > FU_DUE_SHOWN
      ? '<button class="panel-link" onclick="toggleDueAll()">' +
        (fuDueAll ? 'ย่อลง' : 'ดูทั้งหมด ' + fuDue.length + ' ราย') + ' ' + icon('arrow', 14, 2) + '</button>'
      : '') +
    '</div>' + shown.map(dueRow).join('') + '</div>';
}

function dueRow(u) {
  var when = u.days_left < 0 ? 'เลยนัด ' + (-u.days_left) + ' วัน'
    : (u.days_left === 0 ? 'วันนี้' : (u.days_left === 1 ? 'พรุ่งนี้' : 'อีก ' + u.days_left + ' วัน'));
  // บอกด้วยว่าตามครั้งล่าสุดเมื่อไร จะได้แยกออกว่ารายไหนตามไปแล้วแต่ลืมเลื่อนนัด
  var last = u.last_fu ? 'ตามล่าสุด ' + thDate(u.last_fu) : 'ยังไม่เคยบันทึกการติดตาม';
  var who = esc(u.name || u.hn);

  return '<div class="list-row" onclick="go(\'detail\',\'' + esc(u.hn) + '\')">' +
    '<span class="avatar row">' + esc(initials(u.name)) + '</span>' +
    '<span class="who"><b>' + who + '</b>' +
    '<small class="num">HN ' + esc(u.hn) + ' · นัด ' + esc(thDate(u.appt)) + ' · ' + esc(last) + '</small></span>' +
    '<span class="when num' + (u.days_left <= 0 ? ' soon' : '') + '">' + esc(when) + '</span>' +
    '<button class="row-edit" title="บันทึกการติดตามของ ' + who + '" aria-label="บันทึกการติดตามของ ' + who + '"' +
    ' onclick="event.stopPropagation(); go(\'fu\',\'' + esc(u.hn) + '\')">' + icon('calplus', 16, 1.9) + '</button>' +
    '</div>';
}

function toggleDueAll() {
  fuDueAll = !fuDueAll;
  drawFollowups();
}

function matchesFu(f) {
  if (fuFilter.type && String(f.fu_type) !== fuFilter.type) return false;
  if (!matchesFuWhen(f)) return false;
  var q = String(fuFilter.q || '').trim().toLowerCase();
  if (!q) return true;
  return [f.hn, f.patient_name, f.fu_type, f.complications, f.note]
    .join(' ').toLowerCase().indexOf(q) !== -1;
}

/**
 * ช่วงเวลาของรายการหนึ่ง
 * "ยังไม่มีวันที่" เป็นตัวเลือกในดรอปดาวน์เดียวกัน เพราะเป็นกองงานที่ต้องไล่เติม
 * ไม่ใช่ของเสียที่ควรซ่อน ถ้าไม่มีทางเลือกดู ก็ไม่มีใครรู้ว่ามันค้างอยู่
 */
function matchesFuWhen(f) {
  var key = fuFilter.when, d = String(f.fu_date || '');
  if (!key) return true;
  if (key === 'nodate') return !d;
  if (!d) return false;
  if (key === 'fy') return periodKey(d, 'years') === periodKey(BOOT.today, 'years');
  return daysAgo_(d) <= Number(key);
}

/** ห่างจากวันนี้กี่วัน คิดจากข้อความ yyyy-MM-dd ตรง ๆ ทั้งสองฝั่งจึงไม่ขึ้นกับเขตเวลาของเครื่อง */
function daysAgo_(iso) {
  return Math.round((new Date(BOOT.today) - new Date(iso)) / 86400000);
}

function paintFuRows() {
  var body = document.getElementById('fu-body');
  if (!body) return;   // ผู้ใช้เปลี่ยนหน้าไปแล้วระหว่างรอข้อมูล

  fuRows = fuAll.filter(matchesFu);
  var nodate = fuAll.filter(function (f) { return !f.fu_date; }).length;

  body.innerHTML = fuRows.map(followupRow).join('');
  document.getElementById('fu-card').hidden = !fuRows.length;
  document.getElementById('fu-empty').hidden = !!fuRows.length;
  if (!fuRows.length) document.getElementById('fu-empty-text').innerHTML = emptyFuText();
  document.getElementById('fu-shown').textContent = fuRows.length ? 'แสดง ' + fuRows.length + ' รายการ' : '';

  /*
    นับจากทุกรายการเสมอ ไม่ใช่เฉพาะที่กรองอยู่ เพราะบรรทัดนี้เป็นภาพรวมของทั้งระบบ
    แยกรายการที่ยังไม่มีวันที่ออกมาให้เห็น เป็นช่องที่ต้องไล่เติมจากแฟ้มเก่า เลือกดูได้จากตัวกรอง
  */
  document.getElementById('fu-count').textContent =
    'ทั้งหมด ' + fuAll.length + ' รายการ' +
    (nodate ? ' · ยังไม่มีวันที่ ' + nodate + ' รายการ' : '');
}

function followupRow(f) {
  return '<tr onclick="go(\'detail\',\'' + esc(f.hn) + '\')">' +
    '<td class="head"><strong class="num">' + fuDateCell(f) + '</strong> ' + esc(f.patient_name) + '</td>' +
    // hn-cell = ช่องที่ซ่อนบนมือถือเพราะหัวการ์ดบอกไปแล้ว (ดู css.html) ที่นี่คือวันที่
    '<td data-l="วันที่" class="num hn-cell">' + fuDateCell(f) + '</td>' +
    '<td data-l="ผู้ป่วย" class="name-cell"><div class="cell-person">' +
      '<span class="avatar row">' + esc(initials(f.patient_name)) + '</span>' +
      '<span class="who"><b>' + esc(f.patient_name || '—') + '</b>' +
      '<small class="num">' + esc(f.hn) + '</small></span>' +
    '</div></td>' +
    '<td data-l="ครั้งที่" class="num">' + esc(f.seq) + '</td>' +
    '<td data-l="ประเภท">' + (f.fu_type ? '<span class="chip chip-sq">' + esc(f.fu_type) + '</span>' : '—') + '</td>' +
    '<td data-l="บันทึก">' + fuText(f) + '</td>' +
    '<td>' + editBtn('fu', f.hn, f.fu_id, 'บันทึกการติดตามครั้งที่ ' + f.seq) + '</td>' +
    '</tr>';
}

/** หน้าว่างบอกด้วยว่าว่างเพราะกรองไว้หรือเพราะยังไม่มีใครบันทึก แล้วเสนอทางออกให้ตรงกัน */
function emptyFuText() {
  if (fuFilter.q || fuFilter.type || fuFilter.when) {
    return 'ไม่มีรายการตามเงื่อนไขที่กรองอยู่' +
      '<div class="btn-row" style="justify-content:center">' +
      '<button class="btn" onclick="clearFuFilters()">ล้างตัวกรอง</button></div>';
  }
  return 'ยังไม่มีบันทึกการติดตาม' +
    '<div class="btn-row" style="justify-content:center">' +
    '<button class="btn btn-primary" onclick="pickPatientForFu()">+ บันทึกการติดตามครั้งแรก</button></div>';
}

function clearFuFilters() {
  fuFilter = { q: '', type: '', when: '' };
  drawFollowups();
}

/*
  บันทึกการติดตามต้องเริ่มจากรู้ว่าเป็นของใคร เดิมเริ่มจากหน้านี้ไม่ได้เลย
  ต้องอ้อมไปหน้ารายชื่อแล้วเปิดเวชระเบียนก่อน ทั้งที่หน้านี้คือหน้าที่คนเปิดเพื่อจะบันทึก

  ยืมหน้ารายชื่อมาเป็นตัวเลือกคน แทนที่จะสร้างรายการให้เลือกขึ้นมาใหม่ เพราะที่นั่นมีทั้ง
  ช่องค้นหาและตัวกรองอยู่แล้ว คนที่นึกชื่อไม่ออกจะได้ค้นด้วย HN หรือกรองตาม Ward ได้
*/
function pickPatientForFu() {
  go('list', { pick: 'fu' });
}
